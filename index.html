const SISTEMA_FACTURA=`Lees imágenes de facturas, recibos, extractos y pantallazos de apps bancarias colombianas, extraes los GASTOS y los clasificas según COICOP 2018, la clasificación de consumo de los hogares de Naciones Unidas.

═══ CÓMO CLASIFICAR: primero el negocio, después cada ítem ═══

PASO 1 — Entiende dónde se hizo el gasto. Antes de mirar un solo renglón, identifica qué clase de negocio emitió el documento y a qué división apunta. Un hotel apunta a "Restaurantes y alojamiento". Un restaurante también. Un supermercado apunta a "Mercado y bebidas". Una estación de servicio a "Transporte". Escribe eso en "establecimiento" con una razón de una frase.

PASO 2 — Baja ítem por ítem y confirma o corrige. La división del negocio es tu punto de partida, no tu conclusión. Para cada renglón pregúntate si de verdad pertenece ahí. Marca sigue_prior en true cuando se queda, en false cuando lo sacas.

Cuándo el ítem se QUEDA con la división del negocio:
- Todo lo consumido dentro de un hotel — habitación, restaurante del hotel, piscina, spa, minibar, lavandería, parqueadero del hotel — es "Restaurantes y alojamiento". Es un consumo de estadía, no de mercado ni de recreación, aunque el renglón diga "almuerzo" o "piscina".
- Todo lo consumido en un restaurante, café o bar — platos, bebidas, postres, domicilio, propina — es "Restaurantes y alojamiento". Comer fuera NUNCA es "Mercado y bebidas", aunque sean alimentos: la división separa el mercado del día a día del consumo fuera de casa.

Cuándo el ítem se SALE a otra división:
- Las grandes superficies mixtas (Alkosto, Éxito, Falabella, Jumbo, Makro) venden de todo. Ahí el nombre del almacén no decide nada: decide el producto. En una misma factura de Alkosto, el arroz va a "Mercado y bebidas", una camiseta a "Ropa y calzado", un videojuego a "Recreación, deporte y cultura", un televisor a "Muebles y artículos del hogar" y un celular a "Comunicaciones y tecnología".
- Lo mismo aplica en menor escala: una droguería que vende maquillaje mezcla "Salud" con "Cuidado personal y otros"; un supermercado que vende licor mezcla "Mercado y bebidas" con "Alcohol y tabaco".

Cuando dudes entre dos divisiones, decide por la FINALIDAD del gasto, no por la naturaleza del producto. Es el criterio de COICOP: la misma cerveza es "Alcohol y tabaco" comprada en la tienda y "Restaurantes y alojamiento" tomada en un bar.

═══ SUBCATEGORÍA ═══
Además de la división, dale a cada ítem una subcategoría corta y concreta que describa el gasto en lenguaje cotidiano: 1 a 3 palabras, en minúscula salvo nombres propios. "mercado semanal", "salida en pareja", "gasolina", "hotel familiar", "medicamentos", "regalo cumpleaños". Te pasaré las subcategorías que esta persona ya viene usando: REUTILIZA una existente siempre que describa bien el gasto, y solo inventa una nueva cuando ninguna encaje. Es su vocabulario, no el tuyo — la idea es que con el tiempo se parezca a su vida y no a un catálogo genérico.


Formato de cifras en Colombia: el punto separa miles y la coma separa decimales. "$ 1.234.567" son 1234567 pesos, no 1,23. "12.500" son doce mil quinientos. Devuelve siempre el número entero de pesos, sin separadores.

Qué devolver según el documento:
- Pantallazo de movimientos o extracto bancario: un item por cada transacción que sea SALIDA de dinero. Ignora por completo las entradas, los abonos y los saldos.
- Factura o recibo de una compra: un item por cada línea de producto o servicio que se distinga.
- Si solo se ve un total y no hay líneas legibles: un único item con ese total.

Reglas que evitan contar doble:
- Si ya listaste las líneas, NO agregues además un item con el total.
- Nunca crees un item para el IVA, impuestos, subtotales o el total. En Colombia los precios de las líneas ya suelen incluir IVA.
- La propina sí es un item aparte, porque es un gasto adicional real.
- Descuentos y devoluciones no son items; réstalos de la línea que corresponda.

Si la imagen no contiene ningún gasto, devuelve items vacío y explica por qué en "nota". No inventes cifras: si un monto está borroso o cortado, no lo adivines — omite el item y dilo en "nota", y marca la confianza como baja.

/* Una pasada de lectura. `esfuerzo` controla cuánto razona Claude antes de
   responder: es la palanca que más mueve el tiempo de respuesta. */
/* Le mostramos el vocabulario que esta persona ya viene usando, para que
   reutilice sus etiquetas en vez de inventar sinónimos cada vez. */
function vocabularioSubcategorias(){
  const ent=Object.entries(S.subcatEgreso||{}).filter(([,v])=>v&&v.length);
  if(!ent.length)return 'Todavía no hay subcategorías registradas: crea las primeras.';
  return ent.map(([cat,subs])=>`- ${cat}: ${subs.join(', ')}`).join('\n');
}

async function extraerGastos(img,esfuerzo,opts){
  const r=await llamarClaude({
    model:MODELO_VISION,
    max_tokens:5000,
    system:SISTEMA_FACTURA,
    output_config:{effort:esfuerzo,format:{type:'json_schema',schema:esquemaFactura()}},
    messages:[{role:'user',content:[
      {type:'image',source:{type:'base64',media_type:img.mediaType,data:img.base64}},
      {type:'text',text:`Extrae los gastos de esta imagen. Hoy es ${today()}. Si el documento no trae fecha, usa la de hoy.

Subcategorías que esta persona ya usa (reutiliza la que encaje antes de inventar una nueva):
${vocabularioSubcategorias()}`}
    ]}]
  },opts);
  let res;
  try{res=JSON.parse(r.text)}catch(_){throw new Error('La IA no devolvió un JSON legible')}
  return {res,usage:r.usage};
}

/* Cronómetro en vivo: en vez de prometerte un rango, te muestra el real. */
let _cronoEsc=null;
function pintarCargando(img,detalle){
  openModal(`<h2>📷 Leyendo la factura...</h2>
    <div style="display:flex;gap:16px;align-items:flex-start;margin-top:12px">
      <img src="${img.dataUrl}" style="width:150px;border-radius:12px;border:1px solid var(--card-border)">
      <div style="flex:1">
        <div style="color:var(--cyan);font-weight:600;margin-bottom:6px">${detalle}</div>
        <div style="color:var(--muted);font-size:.86rem">Identificando cada gasto y clasificándolo en tus categorías.</div>
        <div style="margin-top:10px;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums" id="esc-crono">0.0 s</div>
      </div>
    </div>`);
}
function arrancarCrono(){
  const t0=performance.now();
  clearInterval(_cronoEsc);
  _cronoEsc=setInterval(()=>{
    const el=document.getElementById('esc-crono');
    if(!el)return clearInterval(_cronoEsc);
    el.textContent=((performance.now()-t0)/1000).toFixed(1)+' s';
  },100);
  return t0;
}

async function onEscaneoPick(e){
  const file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!file)return;
  let img;
  try{img=await comprimirImagen(file)}catch(err){return toast(err.message,'error')}

  pintarCargando(img,'Analizando la imagen');
  const t0=arrancarCrono();

  try{
    // 1ª pasada en esfuerzo bajo. El razonamiento por etapas ya va escrito
    // en el propio JSON (establecimiento → ítems), así que no hace falta
    // gastarlo además en pensar largo.
    let {res,usage}=await extraerGastos(img,'low');
    let esfuerzoUsado='rápido';
    const gastadoMs=performance.now()-t0;

    // Red de seguridad: si quedó dudando, repite con más detalle. Pero solo
    // si la primera fue rápida: si ya tardó, un segundo intento largo choca
    // contra el corte del servidor y perderíamos también el primer resultado.
    if((res.confianza==='baja'||!(res.items||[]).length)&&gastadoMs<35000){
      pintarCargando(img,'Imagen difícil — revisando con más detalle');
      arrancarCrono();
      try{
        const seg=await extraerGastos(img,'high',{tope:TOPE_ESPERA_MS-gastadoMs});
        if((seg.res.items||[]).length>=(res.items||[]).length){res=seg.res;usage=seg.usage;esfuerzoUsado='detallado'}
      }catch(_){/* si la 2ª falla, nos quedamos con la 1ª */}
    }

    clearInterval(_cronoEsc);
    _escaneo={imagen:img,resultado:res,usage,segundos:(performance.now()-t0)/1000,esfuerzo:esfuerzoUsado};
    renderRevisionEscaneo();
  }catch(err){
    clearInterval(_cronoEsc);
    openModal(`<h2>⚠️ No se pudo leer</h2>
      <p style="color:var(--red);margin:12px 0">${err.message}</p>
      <p style="color:var(--muted);font-size:.86rem">Puedes intentar con una foto más nítida, o registrar el gasto a mano.</p>
      <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button><button class="btn btn-primary" onclick="formEscaneo()">Reintentar</button></div>`);
  }
}

function recalcEscaneo(){
  const tabla=document.getElementById('esc-tabla');if(!tabla)return;
  const filas=[...tabla.querySelectorAll('tbody tr')];
  const sel=filas.filter(tr=>tr.querySelector('.esc-chk').checked);
  const suma=sel.reduce((a,tr)=>a+(parseFloat(tr.querySelector('.esc-monto').value)||0),0);
  const agrupar=document.getElementById('esc-agrupar').checked;
  const total=_escaneo?.resultado?.total_documento||0;
  const desfase=total?Math.abs(suma-total):0;

  // Reparto por división, para que veas de un vistazo si la factura quedó
  // partida entre varias categorías (el caso Alkosto).
  const porCat={};
  sel.forEach(tr=>{
    const c=tr.querySelector('.esc-cat').value;
    porCat[c]=(porCat[c]||0)+(parseFloat(tr.querySelector('.esc-monto').value)||0);
  });
  const reparto=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);

  document.getElementById('esc-resumen').innerHTML=
    `<b>${sel.length}</b> de ${filas.length} seleccionados · suma <b class="amount neg">${fmtCOP(suma)}</b>`+
    (total&&desfase>1?` · <span style="color:var(--yellow)">no cuadra con el total impreso (${fmtCOP(total)}), diferencia ${fmtCOP(desfase)}</span>`:
      total?` · <span style="color:var(--green)">cuadra con el total impreso ✓</span>`:'')+
    (reparto.length>1?`<div style="margin-top:6px;color:var(--muted);font-size:.82rem">Se reparte en ${reparto.length} categorías: ${reparto.map(([c,v])=>`${c} ${fmtCOP(v)}`).join(' · ')}</div>`:'');

  // Bloque de agrupado: al activarlo, propone la categoría que más pesa.
  const grupo=document.getElementById('esc-grupo');
  if(grupo){
    const seVeAhora=grupo.style.display!=='none';
    grupo.style.display=agrupar?'block':'none';
    if(agrupar&&!seVeAhora&&reparto.length){
      const catDom=reparto[0][0];
      document.getElementById('esc-grupo-cat').value=catDom;
      const fDom=sel.find(tr=>tr.querySelector('.esc-cat').value===catDom);
      const wGrupo=document.querySelector('#esc-grupo .sub-wrap');
      refrescarSubcat(wGrupo,catDom);
      const subDom=fDom?valorSubcat(fDom.querySelector('.sub-wrap')):'';
      if(subDom)wGrupo.querySelector('.sub-sel').innerHTML=opcionesSubcat(catDom,subDom);
    }
  }

  const btn=document.getElementById('esc-guardar');
  btn.textContent=sel.length?(agrupar?'Guardar 1 gasto':`Guardar ${sel.length} gasto${sel.length>1?'s':''}`):'Guardar';
  btn.disabled=!sel.length;
}

async function guardarEscaneo(){
  const tabla=document.getElementById('esc-tabla');if(!tabla||!_escaneo)return;
  const sel=[...tabla.querySelectorAll('tbody tr')].filter(tr=>tr.querySelector('.esc-chk').checked);
  const datos=sel.map(tr=>({
    descripcion:tr.querySelector('.esc-desc').value.trim(),
    categoria:tr.querySelector('.esc-cat').value,
    subcategoria:valorSubcat(tr.querySelector('.sub-wrap')),
    metodo:tr.querySelector('.esc-met').value,
    fecha:tr.querySelector('.esc-fecha').value||today(),
    monto:parseFloat(tr.querySelector('.esc-monto').value)||0
  })).filter(d=>d.monto>0);
  if(!datos.length)return toast('No hay montos válidos para guardar','error');

  // La foto queda como recibo, ligada a cada gasto que salió de ella.
  const rec={id:uid(),data:_escaneo.imagen.dataUrl,name:'escaneo-'+today()+'.jpg',size:_escaneo.imagen.dataUrl.length,createdAt:new Date().toISOString()};
  await dbPut(rec);

  const comercio=(document.getElementById('esc-comercio').value||'').trim();
  const pre=comercio?comercio+' · ':'';
  const agrupar=document.getElementById('esc-agrupar').checked;
  const cuentaId=valorCuentaLote('esc-cuenta');
  if(agrupar){
    // Un solo gasto = una sola categoría: la que elegiste arriba, no la de la
    // primera fila. Por defecto viene propuesta la que más pesa en la factura.
    const cat=document.getElementById('esc-grupo-cat').value;
    const sub=valorSubcat(document.querySelector('#esc-grupo .sub-wrap'));
    S.egresos.push({id:uid(),fecha:datos[0].fecha,monto:datos.reduce((a,b)=>a+b.monto,0),
      categoria:cat,subcategoria:sub,metodo:datos[0].metodo,cuentaId,
      nota:(pre+datos.map(d=>d.descripcion).join(', ')).slice(0,300),recibos:[rec.id]});
    aprenderSubcategoria(cat,sub);
  }else{
    datos.forEach(d=>{
      S.egresos.push({id:uid(),fecha:d.fecha,monto:d.monto,categoria:d.categoria,
        subcategoria:d.subcategoria,metodo:d.metodo,cuentaId,nota:pre+d.descripcion,recibos:[rec.id]});
      aprenderSubcategoria(d.categoria,d.subcategoria);
    });
  }
  const n=agrupar?1:datos.length;
  _escaneo=null;
  saveState();closeModal();rerender();
  toast(`✓ ${n} gasto${n>1?'s':''} guardado${n>1?'s':''} desde la factura`);
}

const SISTEMA_VOZ=`Conviertes lo que una persona en Colombia dicta o escribe sobre su plata en movimientos financieros estructurados, y los clasificas según COICOP 2018.

Puede mencionar varios movimientos en una sola frase: sepáralos. Distingue si cada uno es INGRESO (entra plata: sueldo, pago de un cliente, venta, reembolso) o EGRESO (sale plata).

═══ CIFRAS HABLADAS ═══
Interpreta el español coloquial colombiano. "veinte mil" son 20000. "treinta lucas" son 30000. "cien barras" son 100000. "un millón dos" o "un millón doscientos" son 1200000. "dos palos" son 2000000. "quinientos" en contexto de gasto cotidiano suele ser 500, pero si habla de arriendo o sueldo son 500000: usa el sentido común según el tipo de gasto. Devuelve siempre el entero de pesos.

═══ FECHAS ═══
"hoy" es la fecha de hoy que te doy. "ayer" es el día anterior, "antier" dos días antes. "el lunes" es el lunes más reciente ya pasado. Si no dice nada, usa hoy.

═══ CLASIFICACIÓN (igual que con una factura) ═══
Clasifica por la FINALIDAD del gasto, no por la naturaleza del producto:
- "almorcé en", "comí en", "fuimos a cenar", "un café con", el nombre de un restaurante o bar → "Restaurantes y alojamiento". Comer fuera NUNCA es "Mercado y bebidas".
- "me quedé en el hotel", "pagué el hotel", y todo lo consumido dentro de un hotel → "Restaurantes y alojamiento".
- "hice mercado", "fui al D1", "compré en la plaza" → "Mercado y bebidas".
- Seguros de cualquier tipo, incluido el del carro → "Seguros y servicios financieros".
- Planes de celular, internet y suscripciones de software → "Comunicaciones y tecnología".
Si menciona un almacén de todo como Alkosto o Éxito, decide por el producto que nombró, no por el almacén.

Dale a cada egreso una subcategoría corta. Te paso las que ya usa: reutiliza la que encaje antes de inventar una.

Si algo quedó ambiguo — un monto que no se entendió, un gasto sin cifra — no lo inventes: omítelo y dilo en "nota", con confianza baja. En "entendido" escribe en una frase qué interpretaste, para que la persona confirme.`;

function esquemaVoz(){
  return {type:'object',additionalProperties:false,
    required:['entendido','confianza','nota','ingresos','egresos'],
    properties:{
      entendido:{type:'string',description:'Una frase con lo que interpretaste.'},
      confianza:{type:'string',enum:['alta','media','baja']},
      nota:{type:'string',description:'Qué quedó ambiguo. "" si todo claro.'},
      ingresos:{type:'array',items:{type:'object',additionalProperties:false,
        required:['descripcion','monto','categoria','fuente','fecha'],
        properties:{
          descripcion:{type:'string'},
          monto:{type:'number'},
          categoria:{type:'string',enum:S.catIngreso},
          fuente:{type:'string',description:'Quién pagó. "" si no lo dice.'},
          fecha:{type:'string',description:'YYYY-MM-DD'}
        }}},
      egresos:{type:'array',items:{type:'object',additionalProperties:false,
        required:['descripcion','monto','categoria','subcategoria','metodo','fecha'],
        properties:{
          descripcion:{type:'string'},
          monto:{type:'number'},
          categoria:{type:'string',enum:COICOP.map(c=>c.nombre)},
          subcategoria:{type:'string'},
          metodo:{type:'string',enum:['',...S.metodos]},
          fecha:{type:'string',description:'YYYY-MM-DD'}
        }}}
    }};
}

const ES_MOVIL=/android|iphone|ipad|ipod/i.test(navigator.userAgent||'');
const VOZ_MAX_REINICIOS=15;      // techo de reanudaciones por sesión
const VOZ_TOPE_MS=90000;         // pausa sola a los 90 s

function vozLimpiarTimers(){
  clearTimeout(_voz.timerReinicio);clearTimeout(_voz.timerTope);
  _voz.timerReinicio=null;_voz.timerTope=null;
}

function vozIniciar(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return toast('Este navegador no reconoce voz','error');
  const rec=new SR();
  rec.lang='es-CO';
  // En móvil el modo continuo es inestable (en iOS prácticamente no funciona):
  // se usa reconocimiento por turnos y se reanuda de forma controlada.
  rec.continuous=!ES_MOVIL;
  rec.interimResults=true;
  _voz.texto=document.getElementById('voz-texto').value;
  _voz.reinicios=0;

  rec.onresult=ev=>{
    const ta=document.getElementById('voz-texto');
    if(!ta)return vozDetener();      // si cerraste el modal, no seguimos escuchando
    let firme='',provisional='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const t=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)firme+=t; else provisional+=t;
    }
    if(firme){_voz.texto=(_voz.texto+' '+firme).trim();_voz.reinicios=0}  // hubo avance real
    ta.value=(_voz.texto+' '+provisional).trim();
    vozRevisarBoton();
  };

  rec.onerror=ev=>{
    if(ev.error==='no-speech'||ev.error==='aborted')return;   // benignos: los maneja onend
    vozDetener();
    vozPintarEstado(ev.error==='not-allowed'
      ? 'Micrófono bloqueado. Actívalo en los permisos del navegador y vuelve a tocar.'
      : 'Se interrumpió el micrófono ('+ev.error+'). Toca para seguir.');
  };

  // El reconocedor se corta solo cada cierto rato, sobre todo en el celular.
  // Se reanuda CON ESPERA y CON TECHO: reintentar de inmediato y sin límite
  // era lo que congelaba la pantalla.
  rec.onend=()=>{
    if(!_voz.escuchando)return;
    if(++_voz.reinicios>VOZ_MAX_REINICIOS){
      vozDetener();
      return vozPintarEstado('Pausé el micrófono. Revisa el texto, o toca para seguir hablando.');
    }
    clearTimeout(_voz.timerReinicio);
    _voz.timerReinicio=setTimeout(()=>{
      if(!_voz.escuchando)return;
      if(!document.getElementById('voz-texto'))return vozDetener();
      try{rec.start()}
      catch(_){ vozDetener();vozPintarEstado('Toca para seguir hablando.') }
    },350);
  };

  _voz.rec=rec;_voz.escuchando=true;
  vozLimpiarTimers();
  _voz.timerTope=setTimeout(()=>{
    if(!_voz.escuchando)return;
    vozDetener();
    vozPintarEstado('Pausé a los 90 segundos. Revisa el texto, o toca para seguir.');
  },VOZ_TOPE_MS);

  try{rec.start()}
  catch(_){ _voz.escuchando=false;vozLimpiarTimers();return vozPintarEstado('No se pudo abrir el micrófono. Escribe el texto abajo.') }
  vozPintarBoton();
  vozPintarEstado(ES_MOVIL?'Escuchando... habla en frases cortas':'Escuchando... habla con naturalidad');
}

function vozDetener(){
  _voz.escuchando=false;
  vozLimpiarTimers();
  try{_voz.rec&&_voz.rec.stop()}catch(_){}
  try{_voz.rec&&_voz.rec.abort&&_voz.rec.abort()}catch(_){}
  _voz.rec=null;
  vozPintarBoton();vozPintarEstado('Listo. Revisa el texto y dale Interpretar.');
}
function vozPintarBoton(){
  const b=document.getElementById('voz-btn');if(!b)return;
  b.textContent=_voz.escuchando?'⏹ Detener':'🎤 Empezar a hablar';
  b.className='btn btn-sm '+(_voz.escuchando?'btn-outline':'btn-primary');
  b.style.cssText='font-size:1.05rem;padding:14px 26px';
}
function vozPintarEstado(t){const e=document.getElementById('voz-estado');if(e)e.textContent=t}
function vozCancelar(){vozDetener();closeModal()}

async function vozInterpretar(){
  const texto=document.getElementById('voz-texto').value.trim();
  if(!texto)return;
  vozDetener();
  openModal(`<h2>🎤 Interpretando...</h2>
    <p style="color:var(--muted);margin:12px 0">"${texto.slice(0,180)}${texto.length>180?'…':''}"</p>
    <div style="font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums" id="esc-crono">0.0 s</div>`);
  const t0=arrancarCrono();
  try{
    const r=await llamarClaude({
      model:MODELO_VISION,max_tokens:4000,system:SISTEMA_VOZ,
      output_config:{effort:'medium',format:{type:'json_schema',schema:esquemaVoz()}},
      messages:[{role:'user',content:`Hoy es ${today()}.\n\nLo que dijo:\n"${texto}"\n\nSubcategorías que ya usa:\n${vocabularioSubcategorias()}`}]
    });
    clearInterval(_cronoEsc);
    const res=JSON.parse(r.text);
    renderRevisionVoz(res,texto,(performance.now()-t0)/1000);
  }catch(err){
    clearInterval(_cronoEsc);
    openModal(`<h2>⚠️ No se pudo interpretar</h2><p style="color:var(--red);margin:12px 0">${err.message}</p>
      <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button><button class="btn btn-primary" onclick="formVoz()">Reintentar</button></div>`);
  }
}

function renderRevisionVoz(R,texto,segs){
  const filas=[
    ...(R.ingresos||[]).map(x=>({...x,tipo:'ing'})),
    ...(R.egresos||[]).map(x=>({...x,tipo:'eg'}))
  ];
  if(!filas.length){
    return openModal(`<h2>🎤 No entendí ningún movimiento</h2>
      <p style="color:var(--muted);margin:12px 0">${R.nota||'No se identificó ningún ingreso ni egreso.'}</p>
      <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Cerrar</button><button class="btn btn-primary" onclick="formVoz()">Intentar de nuevo</button></div>`);
  }
  const colorConf={alta:'green',media:'orange',baja:'red'}[R.confianza]||'orange';
  const cuerpo=filas.map(x=>{
    const f=/^\d{4}-\d{2}-\d{2}$/.test(x.fecha)?x.fecha:today();
    return `<tr data-tipo="${x.tipo}">
      <td><input type="checkbox" class="vz-chk" checked onchange="recalcVoz()"></td>
      <td><select class="icone-select vz-tipo" onchange="vozCambiarTipo(this)">
            <option value="eg" ${x.tipo==='eg'?'selected':''}>Egreso</option>
            <option value="ing" ${x.tipo==='ing'?'selected':''}>Ingreso</option></select></td>
      <td><input class="icone-input vz-desc" value="${(x.descripcion||'').replace(/"/g,'&quot;')}" style="min-width:150px"></td>
      <td class="vz-cat-td">${vozSelectCat(x.tipo,x.categoria)}</td>
      <td class="vz-sub-td">${x.tipo==='eg'?campoSubcat(x.categoria,x.subcategoria,'120px'):'<span style="color:var(--muted)">—</span>'}</td>
      <td><input type="date" class="icone-input vz-fecha" value="${f}"></td>
      <td><input type="number" step="any" class="icone-input vz-monto" value="${x.monto}" style="max-width:110px;text-align:right" oninput="recalcVoz()"></td>
    </tr>`;
  }).join('');

  openModal(`<h2>🎤 Revisa lo que entendí</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.82rem;margin:10px 0">
      <span class="badge ${colorConf}">confianza ${R.confianza||'—'}</span>
      <span class="badge">⚡ ${segs.toFixed(1)} s</span>
    </div>
    <div class="card" style="padding:10px 14px;margin-bottom:12px;font-size:.84rem">
      <div style="color:var(--muted);font-style:italic">"${texto.slice(0,220)}${texto.length>220?'…':''}"</div>
      ${R.entendido?`<div style="margin-top:6px"><b style="color:var(--cyan)">Entendí:</b> ${R.entendido}</div>`:''}
      ${R.nota?`<div style="color:var(--yellow);margin-top:4px">⚠️ ${R.nota}</div>`:''}
    </div>
    <div class="table-wrap" id="vz-tabla" style="max-height:40vh;overflow:auto">
      <table><thead><tr><th></th><th>Tipo</th><th>Descripción</th><th>Categoría</th><th>Subcategoría</th><th>Fecha</th><th style="text-align:right">Monto</th></tr></thead>
      <tbody>${cuerpo}</tbody></table>
    </div>
    <div id="vz-resumen" style="margin-top:12px;font-size:.88rem"></div>
    ${selectCuentaLote('vz-cuenta','¿Qué cuenta se movió?')}
    <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="vz-guardar" onclick="guardarVoz()">Guardar</button>
    </div>`);
  recalcVoz();
}

function vozSelectCat(tipo,sel){
  const lista=tipo==='ing'?S.catIngreso:COICOP.map(c=>c.nombre);
  return `<select class="icone-select vz-cat" onchange="vozCatCambio(this)">${lista.map(c=>`<option ${sel===c?'selected':''}>${c}</option>`).join('')}</select>`;
}
/* Cambiar ingreso↔egreso rehace las categorías y la subcategoría de esa fila.
   Recordamos la categoría de cada tipo, para que si te arrepientes y vuelves
   no pierdas la clasificación que ya tenías. */
function vozCambiarTipo(sel){
  const tr=sel.closest('tr'),tipo=sel.value,anterior=tr.dataset.tipo;
  if(anterior&&anterior!==tipo)tr.dataset['cat'+anterior]=tr.querySelector('.vz-cat').value;
  if(anterior==='eg')tr.dataset.subeg=valorSubcat(tr.querySelector('.sub-wrap'));
  tr.dataset.tipo=tipo;
  tr.querySelector('.vz-cat-td').innerHTML=vozSelectCat(tipo,tr.dataset['cat'+tipo]||'');
  tr.querySelector('.vz-sub-td').innerHTML=tipo==='eg'
    ? campoSubcat(tr.querySelector('.vz-cat').value,tr.dataset.subeg||'','120px')
    : '<span style="color:var(--muted)">—</span>';
  recalcVoz();
}
function vozCatCambio(sel){
  const tr=sel.closest('tr');
  if(tr.dataset.tipo==='eg')refrescarSubcat(tr.querySelector('.sub-wrap'),sel.value);
  recalcVoz();
}
function recalcVoz(){
  const tabla=document.getElementById('vz-tabla');if(!tabla)return;
  const filas=[...tabla.querySelectorAll('tbody tr')];
  const sel=filas.filter(tr=>tr.querySelector('.vz-chk').checked);
  const suma=t=>sel.filter(tr=>tr.dataset.tipo===t).reduce((a,tr)=>a+(parseFloat(tr.querySelector('.vz-monto').value)||0),0);
  const ing=suma('ing'),eg=suma('eg');
  document.getElementById('vz-resumen').innerHTML=
    `<b>${sel.length}</b> de ${filas.length} seleccionados`+
    (ing?` · ingresos <b class="amount pos">+${fmtCOP(ing)}</b>`:'')+
    (eg?` · egresos <b class="amount neg">-${fmtCOP(eg)}</b>`:'');
  const b=document.getElementById('vz-guardar');
  b.textContent=sel.length?`Guardar ${sel.length} movimiento${sel.length>1?'s':''}`:'Guardar';
  b.disabled=!sel.length;
}
function guardarVoz(){
  const sel=[...document.querySelectorAll('#vz-tabla tbody tr')].filter(tr=>tr.querySelector('.vz-chk').checked);
  let nIng=0,nEg=0;
  const cuentaId=valorCuentaLote('vz-cuenta');
  sel.forEach(tr=>{
    const monto=parseFloat(tr.querySelector('.vz-monto').value)||0;
    if(monto<=0)return;
    const base={id:uid(),fecha:tr.querySelector('.vz-fecha').value||today(),monto,
      categoria:tr.querySelector('.vz-cat').value,
      nota:tr.querySelector('.vz-desc').value.trim(),cuentaId,recibos:[]};
    if(tr.dataset.tipo==='ing'){
      S.ingresos.push({...base,fuente:''});nIng++;
    }else{
      const sub=valorSubcat(tr.querySelector('.sub-wrap'));
      S.egresos.push({...base,subcategoria:sub,metodo:S.metodos[0]});
      aprenderSubcategoria(base.categoria,sub);nEg++;
    }
  });
  const n=nIng+nEg;
  if(!n)return toast('No hay montos válidos','error');
  saveState();closeModal();

  // Puedes dictar un egreso estando en Ingresos (y al revés). Antes se
  // guardaba bien pero la app te dejaba mirando la lista equivocada, y
  // parecía que no había pasado nada. Ahora te lleva a donde quedó.
  if(nEg&&!nIng)go('egresos');
  else if(nIng&&!nEg)go('ingresos');
  else rerender();

  const partes=[];
  if(nIng)partes.push(`${nIng} ingreso${nIng>1?'s':''}`);
  if(nEg)partes.push(`${nEg} egreso${nEg>1?'s':''}`);
  toast(`✓ Guardé ${partes.join(' y ')}`);
}

/* ═══════════════════════════════════════════════════════════
   RECLASIFICAR EL HISTÓRICO
   La migración automática solo pudo traducir la etiqueta vieja, y
   esas etiquetas eran justo el problema (un hotel guardado como
   "Alimentación" sigue llegando a "Mercado"). Esto relee la nota de
   cada gasto ya registrado y aplica el criterio nuevo.
   ═══════════════════════════════════════════════════════════ */
let _reclas=null;

async function reclasificarHistorico(){
  const eg=(S.egresos||[]).filter(e=>e.monto>0);
  if(!eg.length)return toast('No hay egresos para revisar','error');

  openModal(`<h2>🔄 Revisando tus gastos anteriores</h2>
    <p style="color:var(--muted);margin:12px 0">Releyendo ${eg.length} egreso(s) con el criterio COICOP.</p>
    <div style="font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums" id="esc-crono">0.0 s</div>`);
  arrancarCrono();

  const lista=eg.map(e=>`${e.id} | ${e.fecha} | ${fmtCOP(e.monto)} | ${(e.nota||'(sin nota)').slice(0,90)} | actual: ${e.categoria}`).join('\n');
  try{
    const r=await llamarClaude({
      model:MODELO_VISION,max_tokens:8000,
      system:`Reclasificas gastos ya registrados de una persona en Colombia según COICOP 2018.

Te llega una línea por gasto: id | fecha | monto | descripción | categoría actual. Decide para cada uno la división correcta y una subcategoría corta.

Clasifica por la FINALIDAD del gasto. Lo consumido en un restaurante, café o bar, y todo lo consumido dentro de un hotel, va en "Restaurantes y alojamiento" — nunca en "Mercado y bebidas" ni en "Recreación", aunque el renglón hable de comida o de piscina. El mercado del supermercado sí es "Mercado y bebidas". Los seguros van en "Seguros y servicios financieros" aunque sean del carro. Las suscripciones de software y los planes de celular e internet van en "Comunicaciones y tecnología".

Devuelve SOLO los gastos cuya categoría debe cambiar. Si la actual ya es correcta, omítelo. No inventes ids: usa exactamente los que te doy.

═══ LAS 13 DIVISIONES ═══
`+COICOP.map(c=>`${c.cod}. ${c.nombre} — ${c.guia}`).join('\n'),
      output_config:{effort:'medium',format:{type:'json_schema',schema:{
        type:'object',additionalProperties:false,required:['cambios'],
        properties:{cambios:{type:'array',items:{
          type:'object',additionalProperties:false,required:['id','categoria','subcategoria','razon'],
          properties:{
            id:{type:'string'},
            categoria:{type:'string',enum:COICOP.map(c=>c.nombre)},
            subcategoria:{type:'string'},
            razon:{type:'string',description:'Media frase: por qué cambia.'}
          }}}}}}},
      messages:[{role:'user',content:`Gastos a revisar:\n${lista}\n\nSubcategorías que ya usa:\n${vocabularioSubcategorias()}`}]
    });
    clearInterval(_cronoEsc);
    const {cambios}=JSON.parse(r.text);
    const validos=(cambios||[]).filter(c=>eg.some(e=>e.id===c.id&&e.categoria!==c.categoria));
    _reclas=validos;
    if(!validos.length){
      return openModal(`<h2>✓ Todo está bien clasificado</h2>
        <p style="color:var(--muted);margin:12px 0">Revisé ${eg.length} egreso(s) y ninguno necesita cambiar de categoría.</p>
        <div style="display:flex;justify-content:flex-end;margin-top:18px"><button class="btn btn-primary" onclick="closeModal()">Listo</button></div>`);
    }
    openModal(`<h2>🔄 ${validos.length} cambio(s) propuesto(s)</h2>
      <p style="color:var(--muted);font-size:.86rem;margin:8px 0 12px">De ${eg.length} egresos revisados. Desmarca los que no quieras aplicar.</p>
      <div class="table-wrap" id="rec-tabla" style="max-height:46vh;overflow:auto">
        <table><thead><tr><th></th><th>Gasto</th><th>De</th><th>A</th><th>Subcategoría</th></tr></thead><tbody>
        ${validos.map(c=>{const e=eg.find(x=>x.id===c.id);return `<tr data-id="${c.id}">

function aplicarReclasificacion(){
  const ids=[...document.querySelectorAll('#rec-tabla tbody tr')].filter(tr=>tr.querySelector('.rec-chk').checked).map(tr=>tr.dataset.id);
  let n=0;
  ids.forEach(id=>{
    const c=_reclas.find(x=>x.id===id),e=S.egresos.find(x=>x.id===id);
    if(!c||!e)return;
    if(!e.categoriaPrevia)e.categoriaPrevia=e.categoria;   // sigue siendo reversible
    e.categoria=c.categoria;
    if(c.subcategoria)e.subcategoria=c.subcategoria;
    aprenderSubcategoria(c.categoria,c.subcategoria);
    n++;
  });
  _reclas=null;
  saveState();closeModal();rerender();
  toast(`✓ ${n} gasto(s) reclasificado(s)`);
}

async function exportData(){
  const recibos=await dbAll();
  const blob=new Blob([JSON.stringify({state:S,modules:modulesCustom,recibos,exportedAt:new Date().toISOString(),version:1},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`icone-finanzas-${today()}.json`;a.click();
  toast('Exportación lista');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=async ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!confirm('¿Reemplazar todos los datos actuales con los importados?'))return;
      S={...S,...d.state};
      normalizeState();
      modulesCustom=d.modules||[];
      saveState();
      if(d.recibos)for(const rec of d.recibos)await dbPut(rec);
      rerender();toast('Datos importados','success');
    }catch(err){toast('Archivo inválido','error')}
  };r.readAsText(f);
}
async function wipeAll(){
  if(!confirm('⚠️ Esto borrará TODOS tus datos y recibos. ¿Continuar?'))return;
  if(!confirm('Esta acción NO se puede deshacer. ¿Seguro?'))return;
  localStorage.removeItem(STORE_KEY);localStorage.removeItem(STORE_KEY+'_modules');
  const all=await dbAll();for(const r of all)await dbDel(r.id);
  location.reload();
}
async function forceReset(){
  /* Ya no hay seed que recargar: esto borra la copia local y vuelve a
     bajar de la nube. Si no hay sesión iniciada, la app arranca vacía. */
  if(!confirm('Se borrarán los datos guardados en ESTE dispositivo y se volverán a bajar de la nube.\n\nSi no has iniciado sesión, la app quedará vacía y tendrás que importar un respaldo. ¿Continuar?'))return;
  localStorage.clear();
  const all=await dbAll();for(const r of all)await dbDel(r.id);
  // forzar bypass de caché agregando timestamp a la URL
  location.href=location.pathname+'?v='+Date.now();
}

/* ===================================================
   PARTÍCULAS DE FONDO
   =================================================== */
function initParticles(){
  const c=document.getElementById('particles');const ctx=c.getContext('2d');
  let W,H,parts=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;parts=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:Math.random()*2+1,h:Math.random()<.5?200:280}))}
  resize();window.addEventListener('resize',resize);
  function loop(){
    ctx.clearRect(0,0,W,H);
    parts.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${p.h},100%,60%,.5)`;ctx.fill();
    });
    requestAnimationFrame(loop);
  }
  loop();
}

/* Tracking del cursor para efecto shine en botones (Tesla-style) */
document.addEventListener('mousemove',e=>{
  const btn=e.target.closest('.btn');if(!btn)return;
  const r=btn.getBoundingClientRect();
  btn.style.setProperty('--mx',(e.clientX-r.left)+'px');
  btn.style.setProperty('--my',(e.clientY-r.top)+'px');
});

(async function init(){
  loadState();
  await openDB();
  initParticles();
  rerender();
  // Inicializar sincronización (no bloquea el render)
  initSupabase();
})();
</script>
