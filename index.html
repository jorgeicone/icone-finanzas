<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#050d1f">
<title>ICONE Finanzas | Gestión Financiera Personal</title>
<!-- El SVG es el maestro: el navegador lo escala sin que el signo $ se
     empaste a 16px. Los PNG quedan de respaldo para navegadores viejos y
     porque iOS no acepta SVG en apple-touch-icon. -->
<link rel="icon" type="image/svg+xml" href="img/icono.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icono-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --navy:#050d1f; --navy2:#0a1a3a;
  --cyan:#00d4ff; --purple:#7b2fff; --orange:#ff8c00;
  --green:#00d48a; --red:#ff4757; --yellow:#ffd93d;
  --white:#fff; --muted:rgba(255,255,255,.55);
  --card-bg:rgba(255,255,255,.04); --card-border:rgba(0,212,255,.18);
  --sidebar-w:240px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--navy);color:var(--white);font-family:'SF Pro Display','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.01em}
button,input,select,textarea{font-family:inherit;letter-spacing:inherit}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at top left,rgba(123,47,255,.15),transparent 50%),radial-gradient(ellipse at bottom right,rgba(0,212,255,.12),transparent 50%);pointer-events:none;z-index:0}
/* Fotografía de fondo por sección. El degradado va DENTRO de la misma capa,
   así el oscurecimiento viaja siempre con la imagen y el texto encima
   conserva contraste pase lo que pase. */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(5,13,31,.58),rgba(5,13,31,.74)),var(--fondo-seccion,none);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:background-image .4s ease}
@media (prefers-reduced-motion:reduce){body::after{transition:none}}
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.45}

/* Layout */
.app{display:flex;min-height:100vh;position:relative;z-index:2}
.sidebar{width:var(--sidebar-w);background:rgba(5,13,31,.85);backdrop-filter:blur(12px);border-right:1px solid rgba(0,212,255,.15);padding:24px 16px;position:fixed;height:100vh;overflow-y:auto;z-index:10}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px;padding:0 8px}
/* El logo es el mismo icono de la app. El render 3D de la moneda en vidrio
   se veía como una mancha oscura: vidrio oscuro sobre barra oscura, sin
   silueta. Ahora es la placa con degradado de marca y el $ blanco, que es
   lo que se lee tanto aquí a 44px como en la pestaña a 16px. */
.brand-logo{width:44px;height:44px;border-radius:10px;display:block;flex-shrink:0;
  box-shadow:0 8px 24px -8px rgba(0,212,255,.5),0 4px 12px rgba(123,47,255,.28)}
/* Desglose foto -> proyectado en la tarjeta de cada cuenta */
.proy-box{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.18);border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;flex-direction:column;gap:5px}
.proy-box>div{display:flex;justify-content:space-between;font-size:.8rem;gap:8px}
.proy-box .k{color:rgba(255,255,255,.62);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cuenta-hint{font-size:.75rem;color:var(--muted);margin-top:6px;line-height:1.4}
.brand-name{font-weight:800;font-size:1.05rem;line-height:1.1}
.brand-name small{display:block;font-size:.65rem;color:var(--muted);font-weight:500;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.nav-section{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;cursor:pointer;color:rgba(255,255,255,.72);transition:background .18s,color .18s,transform .15s;font-size:.93rem;font-weight:500;margin-bottom:3px;border:1px solid transparent;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(123,47,255,.12));color:#fff;border-color:rgba(0,212,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 14px -6px rgba(0,212,255,.3)}
.nav-icon{font-size:1.15rem;width:22px;text-align:center}
.add-module{margin-top:14px;border:1.5px dashed rgba(0,212,255,.3);color:var(--cyan);justify-content:center;font-size:.85rem}
.add-module:hover{background:rgba(0,212,255,.08);border-style:solid}

.main{flex:1;margin-left:var(--sidebar-w);padding:28px 36px;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-size:1.7rem;font-weight:800}
.page-title .gradient{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.page-sub{color:var(--muted);font-size:.9rem;margin-top:2px}

/* ═══ BOTONES APPLE / TESLA ═══════════════════════════
   Pill perfectos, glass, tactiles, feedback premium */
.btn{
  --bg:rgba(255,255,255,.08); --fg:#fff; --bd:rgba(255,255,255,.12);
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 24px;border-radius:999px;font-weight:600;font-size:.94rem;
  letter-spacing:-.015em;line-height:1;cursor:pointer;border:1px solid var(--bd);
  background:var(--bg);color:var(--fg);position:relative;overflow:hidden;
  font-family:inherit;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:transform .25s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s,background .25s,border-color .25s,filter .2s;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -1px 0 rgba(0,0,0,.2),0 4px 16px -8px rgba(0,0,0,.5);
  white-space:nowrap;
}
.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.18) 0%,transparent 50%);opacity:.8;pointer-events:none;transition:opacity .25s}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.25),transparent 60%);opacity:0;transition:opacity .35s;pointer-events:none}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn:hover::after{opacity:1}
.btn:active{transform:scale(.96);transition:transform .08s}
.btn:active::before{opacity:1}

/* Primario: degradé cyan→púrpura, sombra de profundidad */
.btn-primary{
  --bg:linear-gradient(135deg,#00d4ff 0%,#1d8aff 50%,#7b2fff 100%);
  --fg:#fff; --bd:rgba(255,255,255,.18);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -2px 4px rgba(0,0,0,.25),
    0 6px 20px -6px rgba(0,212,255,.55),
    0 12px 32px -10px rgba(123,47,255,.4),
    0 2px 6px rgba(0,0,0,.3);
  text-shadow:0 1px 1px rgba(0,0,0,.15);
}
.btn-primary:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,0,.25),0 10px 28px -6px rgba(0,212,255,.7),0 18px 40px -10px rgba(123,47,255,.5),0 2px 6px rgba(0,0,0,.3)}

/* Outline: vidrio claro con borde brillante */
.btn-outline{
  --bg:rgba(0,212,255,.08); --fg:#00d4ff; --bd:rgba(0,212,255,.45);
  box-shadow:inset 0 1px 0 rgba(0,212,255,.15),0 4px 16px -8px rgba(0,212,255,.3);
}
.btn-outline:hover{--bg:rgba(0,212,255,.16);--bd:rgba(0,212,255,.7)}

/* Ghost: glass neutro */
.btn-ghost{--bg:rgba(255,255,255,.07);--bd:rgba(255,255,255,.1)}
.btn-ghost:hover{--bg:rgba(255,255,255,.14);--bd:rgba(255,255,255,.18)}

/* Danger: rojo glass */
.btn-danger{--bg:rgba(255,71,87,.14);--fg:#ff6b78;--bd:rgba(255,71,87,.4);box-shadow:inset 0 1px 0 rgba(255,107,120,.2),0 4px 16px -8px rgba(255,71,87,.4)}
.btn-danger:hover{--bg:rgba(255,71,87,.24);--bd:rgba(255,71,87,.7)}

/* Verde acción (actualizar) */
.btn-success{
  --bg:linear-gradient(135deg,#00e09a 0%,#00b8e6 100%);
  --fg:#001a14; --bd:rgba(255,255,255,.25);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 20px -6px rgba(0,212,138,.55),0 2px 6px rgba(0,0,0,.3);
  font-weight:700;
}
.btn-success:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 28px -6px rgba(0,212,138,.75),0 2px 6px rgba(0,0,0,.3)}

/* Tamaños */
.btn-sm{padding:9px 16px;font-size:.83rem}
.btn-lg{padding:17px 30px;font-size:1rem}

/* Icon button — circular Tesla-style */
.btn-icon{padding:0;width:40px;height:40px;border-radius:50%;justify-content:center}
.btn-icon.btn-sm{width:34px;height:34px;font-size:.9rem}

/* Tracking del cursor para shine effect */
.btn{--mx:50%;--my:50%}

.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:24px;backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 40px -20px rgba(0,0,0,.4)}
.card h3{font-size:1rem;margin-bottom:14px;font-weight:700;display:flex;align-items:center;gap:8px}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:22px 24px;position:relative;overflow:hidden;backdrop-filter:blur(20px);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 20px 40px -20px rgba(0,0,0,.45);transition:transform .25s,box-shadow .25s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 24px 50px -20px rgba(0,0,0,.55)}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:20px 20px 0 0}
.kpi.green::before{background:linear-gradient(90deg,var(--green),var(--cyan))}
.kpi.red::before{background:linear-gradient(90deg,var(--red),var(--orange))}
.kpi.orange::before{background:linear-gradient(90deg,var(--orange),var(--yellow))}
.kpi-label{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.kpi-value{font-size:1.85rem;font-weight:700;margin-top:10px;line-height:1.05;letter-spacing:-.03em;font-feature-settings:"tnum"}
.kpi-meta{font-size:.78rem;color:var(--muted);margin-top:6px}
.kpi-meta .up{color:var(--green)}
.kpi-meta .down{color:var(--red)}

/* Inputs */
.icone-input,.icone-select,textarea.icone-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:13px 16px;color:#fff;font-size:.95rem;font-family:inherit;outline:none;transition:.2s;letter-spacing:-.01em}
.icone-input:hover,.icone-select:hover{border-color:rgba(255,255,255,.2)}
.icone-input:focus,.icone-select:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,212,255,.15);background:rgba(255,255,255,.07)}
.icone-input::placeholder{color:rgba(255,255,255,.3)}
.icone-select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='%2300d4ff' d='M6 8L0 0h12z'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.icone-select option{background:var(--navy2);color:#fff}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}

/* Tabla */
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
th{background:rgba(0,212,255,.06);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.8px;color:var(--cyan)}
tbody tr:hover{background:rgba(0,212,255,.04)}
.amount{font-weight:600;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
.amount.pos{color:var(--green)}
.amount.neg{color:var(--red)}
.badge{display:inline-block;padding:3px 10px;border-radius:50px;font-size:.72rem;font-weight:600;background:rgba(0,212,255,.12);color:var(--cyan);border:1px solid rgba(0,212,255,.3)}
.badge.purple{background:rgba(123,47,255,.15);color:var(--purple);border-color:rgba(123,47,255,.3)}
.badge.orange{background:rgba(255,140,0,.15);color:var(--orange);border-color:rgba(255,140,0,.3)}
.badge.green{background:rgba(0,212,138,.12);color:var(--green);border-color:rgba(0,212,138,.3)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:12px;opacity:.4}

/* Grids */
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px;margin-bottom:18px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.chart-wrap{position:relative;height:280px}
.chart-wrap-sm{position:relative;height:220px}

/* Recibos gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid rgba(0,212,255,.2);cursor:pointer;background:rgba(255,255,255,.04)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);padding:18px 10px 8px;font-size:.72rem}
.thumb-info .a{font-weight:700;color:var(--cyan)}
.thumb:hover{border-color:var(--cyan);box-shadow:0 0 20px rgba(0,212,255,.3)}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.active{display:flex}
.modal{background:#0a1530;border:1px solid rgba(0,212,255,.3);border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:28px;position:relative}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.08);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.1rem}
.modal h2{margin-bottom:18px;font-size:1.3rem}
.modal-img{max-width:90vw;max-height:85vh;border-radius:14px;border:2px solid var(--cyan);box-shadow:0 0 40px rgba(0,212,255,.5)}

/* Upload */
.upload-zone{border:2px dashed rgba(0,212,255,.35);border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:.2s;background:rgba(0,212,255,.03)}
.upload-zone:hover{border-color:var(--cyan);background:rgba(0,212,255,.08)}
.upload-zone input{display:none}
.upload-icon{font-size:2rem;margin-bottom:6px}
.preview-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview-strip .p{width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid rgba(0,212,255,.3);position:relative}
.preview-strip .p img{width:100%;height:100%;object-fit:cover}
.preview-strip .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);color:var(--red);border:none;width:18px;height:18px;border-radius:50%;cursor:pointer;font-size:.7rem;line-height:1;display:grid;place-items:center}

/* Toast — más visible */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(120px);background:linear-gradient(135deg,#0a1530,#0f1f3d);border:2px solid var(--green);border-radius:14px;padding:16px 26px;z-index:2000;box-shadow:0 16px 50px rgba(0,212,138,.4),0 4px 12px rgba(0,0,0,.5);min-width:280px;max-width:90vw;opacity:0;transition:.35s cubic-bezier(.2,.9,.3,1.2);font-weight:600;font-size:.98rem;text-align:center;backdrop-filter:blur(12px)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-color:var(--red);box-shadow:0 16px 50px rgba(255,71,87,.4),0 4px 12px rgba(0,0,0,.5)}
.toast.success{border-color:var(--green)}

/* Module hidden/visible */
.view{display:none;animation:fade .3s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Mobile */
.menu-btn{display:none;background:rgba(0,212,255,.12);border:1px solid var(--cyan);color:var(--cyan);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:.3s;width:260px}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:20px 18px}
  .menu-btn{display:inline-flex}
}

/* Color dot for accounts */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* Scrollbar */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}
::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:50px}
::-webkit-scrollbar-thumb:hover{background:rgba(0,212,255,.4)}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="img/icono.svg" alt="ICONE Finanzas" width="44" height="44">
      <div class="brand-name">ICONE Finanzas<small>ialabs</small></div>
    </div>

    <div class="nav-section">Principal</div>
    <div id="nav-list"></div>

    <div class="nav-section">Datos</div>
    <div class="nav-item" data-go="config"><span class="nav-icon">⚙️</span><span>Configuración</span></div>
    <div class="nav-item add-module" onclick="openAddModule()"><span>＋ Agregar módulo</span></div>

    <div id="sync-indicator" onclick="go('config')" style="margin-top:16px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;gap:10px;font-size:.82rem;transition:.2s">
      <span id="sync-dot" style="width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3)"></span>
      <div style="flex:1;min-width:0">
        <div id="sync-label" style="font-weight:600">Modo local</div>
        <div id="sync-sub" style="font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Sin sincronizar</div>
      </div>
    </div>

    <div style="margin-top:14px;padding:10px 12px;font-size:.7rem;color:rgba(255,255,255,.35);text-align:center;border-top:1px solid rgba(255,255,255,.06)">
      <div>ICONE Finanzas <b style="color:var(--cyan)">v0.27</b></div>
      <div style="margin-top:2px">Build 2026-09-02</div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div>
        <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1 class="page-title"><span class="gradient" id="page-title">Dashboard</span></h1>
        <div class="page-sub" id="page-sub">Resumen financiero consolidado</div>
      </div>
      <div id="page-actions"></div>
    </div>

    <div id="view-container"></div>
  </main>
</div>

<!-- Modal genérico -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target.id==='modal-bg')closeModal()">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Modal imagen -->
<div class="modal-bg" id="img-modal" onclick="document.getElementById('img-modal').classList.remove('active')">
  <img id="img-modal-src" class="modal-img" alt="Recibo">
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ICONE FINANZAS — Aplicación financiera personal modular
   Datos: localStorage (key: iconeFinanzas)
   Recibos: IndexedDB (DB: iconeFinanzasDB, store: recibos)
   ============================================================ */

const STORE_KEY='iconeFinanzas';
const fmtCOP=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);
const fmtDate=d=>{if(!d)return'—';const x=new Date(d+'T00:00');return x.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'})};
const fmtMonth=ym=>{const[y,m]=ym.split('-');return new Date(y,m-1,1).toLocaleDateString('es-CO',{month:'short',year:'2-digit'})};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
/* Fecha y mes en HORA LOCAL, nunca en UTC.
   Antes esto era `new Date().toISOString().slice(0,10)`, que devuelve la
   fecha en UTC. Colombia es UTC−5, así que desde las 7 de la noche el
   reloj de la app ya estaba en el día siguiente: todo lo registrado de
   noche quedaba fechado mañana, y el último día del mes se iba al mes
   siguiente. Con getFullYear/getMonth/getDate el día es el que se ve en
   el reloj de la pared, en cualquier huso. */
const dosDig=n=>String(n).padStart(2,'0');
const fechaLocal=d=>`${d.getFullYear()}-${dosDig(d.getMonth()+1)}-${dosDig(d.getDate())}`;
const mesLocal=d=>`${d.getFullYear()}-${dosDig(d.getMonth()+1)}`;
const today=()=>fechaLocal(new Date());
const monthKey=d=>(d||today()).slice(0,7);

/* ═══════════════════════════════════════════════════════════
   TAXONOMÍA DE GASTO — COICOP 2018 (Naciones Unidas)
   Clasificación del Consumo Individual por Finalidad: el estándar
   internacional de gasto de los hogares, y la base que usa el DANE
   para el IPC colombiano. Las 13 divisiones, en lenguaje corriente.
   La clave del diseño: "Restaurantes y alojamiento" es una división
   aparte del mercado, así que un restaurante o un hotel NUNCA caen
   en el gasto de comida del día a día.
   ═══════════════════════════════════════════════════════════ */
const COICOP=[
 {cod:'01',nombre:'Mercado y bebidas',                guia:'Comida y bebida NO alcohólica para preparar o consumir en casa: supermercado, plaza, tienda de barrio, panadería, carnicería, domicilios de mercado. NO incluye comer fuera.'},
 {cod:'02',nombre:'Alcohol y tabaco',                 guia:'Licor, cerveza, vino y cigarrillos comprados para llevar. Si se consumieron en un bar o restaurante van en Restaurantes y alojamiento.'},
 {cod:'03',nombre:'Ropa y calzado',                   guia:'Prendas de vestir, zapatos, accesorios de vestir, telas, sastrería, lavandería.'},
 {cod:'04',nombre:'Vivienda y servicios del hogar',   guia:'Arriendo, administración, cuota hipotecaria, agua, luz, gas, aseo, mantenimiento y reparación de la vivienda.'},
 {cod:'05',nombre:'Muebles y artículos del hogar',    guia:'Muebles, electrodomésticos, menaje, ropa de cama, herramientas, jardín, productos de aseo del hogar y servicio doméstico.'},
 {cod:'06',nombre:'Salud',                            guia:'Medicamentos, consultas, exámenes, odontología, terapias, óptica, hospitalización, medicina prepagada.'},
 {cod:'07',nombre:'Transporte',                       guia:'Vehículo y su uso: compra, gasolina, mantenimiento, parqueadero, peajes, impuestos y trámites del carro. Taxi, bus, metro y tiquetes aéreos.'},
 {cod:'08',nombre:'Comunicaciones y tecnología',      guia:'Plan de celular, internet, telefonía, correo, equipos telefónicos y de cómputo, y suscripciones de software o nube.'},
 {cod:'09',nombre:'Recreación, deporte y cultura',    guia:'Entretenimiento y tiempo libre: cine, conciertos, museos, gimnasio, deportes, juguetes, videojuegos, libros, mascotas, streaming de entretenimiento, paquetes turísticos y excursiones.'},
 {cod:'10',nombre:'Educación',                        guia:'Matrículas, pensiones, cursos, diplomados, capacitaciones y material educativo formal.'},
 {cod:'11',nombre:'Restaurantes y alojamiento',       guia:'Consumo fuera de casa: restaurantes, cafeterías, bares, comidas rápidas, domicilios de comida preparada, y hoteles, hostales y alojamiento. Aquí entra TODO lo consumido dentro de un hotel o un restaurante.'},
 {cod:'12',nombre:'Seguros y servicios financieros',  guia:'Pólizas y seguros de todo tipo, cuotas de manejo, intereses, comisiones bancarias, asesoría financiera y legal.'},
 {cod:'13',nombre:'Cuidado personal y otros',         guia:'Peluquería, barbería, productos de aseo personal, cosméticos, joyería, marroquinería, regalos, donaciones y todo lo que no encaje en las demás divisiones.'}
];

/* ---------- ESTADO ---------- */
let S={
  cuentas:[],
  saldos:[],     // {id,cuentaId,fecha,monto,nota}
  ingresos:[],   // {id,fecha,monto,categoria,fuente,cuentaId,nota,recibos:[]}
  egresos:[],    // {id,fecha,monto,categoria,metodo,cuentaId,nota,recibos:[]}
  /* Traslados entre cuentas propias: {id,fecha,origenId,destinoId,monto,nota}
     Van aparte de ingresos y egresos a propósito. Mueven saldos pero no son
     plata que entra ni que sale de tu patrimonio: pasarlos de Bancolombia a
     Nequi no te hace ni más rico ni más pobre. Al vivir en su propio arreglo
     quedan fuera de todas las gráficas de gasto sin tener que filtrarlos en
     cada una. */
  traslados:[],
  catIngreso:['Salario','Freelance','Inversiones','Ventas','Reembolso','Otros'],
  catEgreso:[...COICOP.map(c=>c.nombre)],
  subcatEgreso:{},   // { "Categoría": ["subcategoría aprendida", ...] }
  taxonomia:'coicop-2018',
  metodos:['Efectivo','Tarjeta débito','Tarjeta crédito','Transferencia','PSE','Nequi','Daviplata'],
  config:{moneda:'COP',frecuencia:'mensual',nombre:'Mi finanzas'}
};
let modulesCustom=[]; // módulos extra creados por usuario

/* Los estados guardados antes de una versión no traen los campos nuevos:
   el tuyo, sin ir más lejos, no tiene 'traslados'. El spread de loadState
   los conserva del valor por defecto, pero eso solo funciona mientras S
   nunca se reemplace entero. Normalizar aquí lo vuelve cierto pase lo que
   pase, y cubre de una vez los tres sitios que sobreescriben el estado:
   carga local, sincronización con la nube y restauración de respaldo. */
function normalizeState(){
  ['cuentas','saldos','ingresos','egresos','traslados','catIngreso','catEgreso','metodos'].forEach(k=>{
    if(!Array.isArray(S[k]))S[k]=[];
  });
  if(!S.subcatEgreso||typeof S.subcatEgreso!=='object')S.subcatEgreso={};
  if(!S.config||typeof S.config!=='object')S.config={moneda:'COP',frecuencia:'mensual',nombre:'Mi finanzas'};
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){const p=JSON.parse(raw);S={...S,...p};}
    const m=localStorage.getItem(STORE_KEY+'_modules');
    if(m)modulesCustom=JSON.parse(m);
  }catch(e){console.error(e)}
  normalizeState();
  migrarTaxonomia();
}

/* Equivalencias de la taxonomía vieja (9 categorías caseras) a COICOP.
   Conservador a propósito: mueve cada gasto a su división más cercana y
   deja `categoriaPrevia` en el registro, así nada se pierde y es reversible. */
const MAPA_TAXONOMIA_VIEJA={
  'Vivienda':'Vivienda y servicios del hogar',
  'Servicios':'Vivienda y servicios del hogar',
  'Alimentación':'Mercado y bebidas',
  'Transporte':'Transporte',
  'Ocio':'Recreación, deporte y cultura',
  'Salud':'Salud',
  'Educación':'Educación',
  'Ropa':'Ropa y calzado',
  'Otros':'Cuidado personal y otros'
};
function migrarTaxonomia(){
  const nuevas=COICOP.map(c=>c.nombre);
  const listaVieja=(S.catEgreso||[]).some(c=>(c in MAPA_TAXONOMIA_VIEJA)&&!nuevas.includes(c));
  let movidos=0;
  (S.egresos||[]).forEach(e=>{
    if(e.categoria&&!nuevas.includes(e.categoria)&&MAPA_TAXONOMIA_VIEJA[e.categoria]){
      e.categoriaPrevia=e.categoria;
      e.categoria=MAPA_TAXONOMIA_VIEJA[e.categoria];
      movidos++;
    }
  });
  if(listaVieja)S.catEgreso=nuevas;
  if(!S.subcatEgreso||typeof S.subcatEgreso!=='object')S.subcatEgreso={};
  S.taxonomia='coicop-2018';
  if(movidos||listaVieja){saveState();console.info(`Taxonomía COICOP aplicada · ${movidos} egreso(s) remapeado(s)`)}
  return movidos;
}

/* ---------- CAMPO DE SUBCATEGORÍA (desplegable + crear nueva) ----------
   Las subcategorías viven DENTRO de una categoría, así que la lista se
   filtra por la categoría elegida en esa misma fila. Si cambias la
   categoría, la lista se actualiza sola. */
function opcionesSubcat(cat,sel){
  const guardadas=(S.subcatEgreso&&S.subcatEgreso[cat])||[];
  const lista=[...new Set([...guardadas,...(sel?[sel]:[])])].sort((a,b)=>a.localeCompare(b,'es'));
  return `<option value="">— sin subcategoría —</option>`
    +lista.map(s=>`<option value="${s.replace(/"/g,'&quot;')}" ${s===sel?'selected':''}>${s}</option>`).join('')
    +`<option value="__nueva__">➕ Crear nueva…</option>`;
}
function campoSubcat(cat,sel,ancho='130px'){
  return `<span class="sub-wrap" style="display:inline-block;min-width:${ancho}">
    <select class="icone-select sub-sel" style="width:100%" onchange="subcatCambio(this)">${opcionesSubcat(cat,sel||'')}</select>
    <input class="icone-input sub-nueva" style="display:none;width:100%" placeholder="nombre nuevo…"
      onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" onblur="subcatNueva(this)">
  </span>`;
}
function subcatCambio(sel){
  if(sel.value!=='__nueva__')return;
  const w=sel.closest('.sub-wrap'),inp=w.querySelector('.sub-nueva');
  sel.style.display='none';inp.style.display='';inp.value='';inp.focus();
}
function subcatNueva(inp){
  const w=inp.closest('.sub-wrap'),sel=w.querySelector('.sub-sel');
  const nombre=inp.value.trim();
  // No se registra todavía en el vocabulario: eso pasa al guardar el gasto,
  // así una etiqueta escrita y luego descartada no ensucia la lista.
  sel.innerHTML=opcionesSubcat(categoriaDeCampo(w),nombre);
  inp.style.display='none';sel.style.display='';
}
function categoriaDeCampo(w){
  const tr=w.closest('tr');
  if(tr&&tr.querySelector('.esc-cat'))return tr.querySelector('.esc-cat').value;
  if(w.closest('#esc-grupo'))return document.getElementById('esc-grupo-cat')?.value||'';
  return document.getElementById('f-cat')?.value||'';
}
function valorSubcat(w){
  if(!w)return '';
  const inp=w.querySelector('.sub-nueva');
  if(inp&&inp.style.display!=='none'&&inp.value.trim())return inp.value.trim();
  const v=w.querySelector('.sub-sel').value;
  return v==='__nueva__'?'':v;
}
/* Cuando cambia la categoría, la lista de subcategorías la sigue. */
function refrescarSubcat(w,cat){
  if(!w)return;
  const sel=w.querySelector('.sub-sel');
  const actual=sel.value==='__nueva__'?'':sel.value;
  const sigueValiendo=((S.subcatEgreso&&S.subcatEgreso[cat])||[]).includes(actual);
  sel.innerHTML=opcionesSubcat(cat,sigueValiendo?actual:'');
  w.querySelector('.sub-nueva').style.display='none';
  sel.style.display='';
}

/* Registra una subcategoría nueva dentro de su división. Así la app
   va aprendiendo tu vocabulario en vez de imponerte uno fijo. */
function aprenderSubcategoria(cat,sub){
  sub=(sub||'').trim();
  if(!cat||!sub)return;
  if(!S.subcatEgreso[cat])S.subcatEgreso[cat]=[];
  const yaEsta=S.subcatEgreso[cat].some(x=>x.toLowerCase()===sub.toLowerCase());
  if(!yaEsta)S.subcatEgreso[cat].push(sub);
}
function saveState(){
  localStorage.setItem(STORE_KEY,JSON.stringify(S));
  localStorage.setItem(STORE_KEY+'_modules',JSON.stringify(modulesCustom));
  localStorage.setItem(STORE_KEY+'_ts',Date.now().toString());
  scheduleCloudSync();
}

/* ═══════════════════════════════════════════════════════════
   SINCRONIZACIÓN CON SUPABASE (multi-dispositivo)
   ═══════════════════════════════════════════════════════════ */
const SUPABASE_URL='https://nvgkhdrrxqdgxktfkioa.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_d1RrtE7S-9a8e8mGKRRjxQ_4HU_nkDl';
/* accessToken se guarda aparte porque al cerrar la pestaña ya no hay tiempo
   de esperar un await: getSession() es asíncrono y el navegador no espera. */
let sb=null,currentUser=null,syncTimer=null,isPulling=false,accessToken=null;

function setSyncStatus(status,sub){
  const dot=document.getElementById('sync-dot');
  const label=document.getElementById('sync-label');
  const subEl=document.getElementById('sync-sub');
  if(!dot)return;
  const map={
    local:{c:'rgba(255,255,255,.35)',l:'Modo local',s:sub||'Sin sincronizar'},
    syncing:{c:'#ffd93d',l:'Sincronizando...',s:sub||'Subiendo cambios'},
    synced:{c:'#00d48a',l:'Sincronizado ✓',s:sub||currentUser?.email||''},
    pulling:{c:'#00d4ff',l:'Bajando datos',s:sub||'Desde la nube'},
    error:{c:'#ff4757',l:'Error de sync',s:sub||'Toca para reintentar'},
    offline:{c:'#ff8c00',l:'Sin conexión',s:sub||'Cambios guardados local'}
  };
  const m=map[status]||map.local;
  dot.style.background=m.c;dot.style.boxShadow=`0 0 10px ${m.c}`;
  label.textContent=m.l;subEl.textContent=m.s;
}

async function initSupabase(){
  if(!window.supabase){setSyncStatus('local','SDK no cargó');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange((event,session)=>{
    currentUser=session?.user||null;
    accessToken=session?.access_token||null;
    if(event==='SIGNED_IN'){pullFromCloud()}
    if(event==='SIGNED_OUT'){setSyncStatus('local')}
  });
  const {data}=await sb.auth.getSession();
  currentUser=data.session?.user||null;
  accessToken=data.session?.access_token||null;
  if(currentUser){await pullFromCloud()}else{setSyncStatus('local')}
}

async function pullFromCloud(forceOverwrite=false){
  if(!currentUser||!sb)return;
  setSyncStatus('pulling');
  isPulling=true;
  try{
    const {data,error}=await sb.from('finanzas_data').select('*').eq('user_id',currentUser.id).maybeSingle();
    if(error)throw error;
    if(data&&data.data&&Object.keys(data.data).length){
      // Comparar timestamps — solo bajar si la nube es MÁS NUEVA que lo local
      const cloudTs=new Date(data.updated_at).getTime();
      const localTs=parseInt(localStorage.getItem(STORE_KEY+'_ts')||'0');
      const localSaldos=(S.saldos||[]).length;
      const cloudSaldos=(data.data.saldos||[]).length;

      if(!forceOverwrite && localTs>cloudTs && localSaldos>=cloudSaldos){
        // Local es más nuevo Y tiene al menos los mismos registros → subimos en vez de bajar
        await pushToCloud();
        toast('⬆️ Local es más reciente: subimos a la nube');
        return;
      }

      S={...S,...data.data};
      normalizeState();
      modulesCustom=data.modules||[];
      migrarTaxonomia();   // los datos de la nube pueden venir con la taxonomía vieja
      localStorage.setItem(STORE_KEY,JSON.stringify(S));
      localStorage.setItem(STORE_KEY+'_modules',JSON.stringify(modulesCustom));
      localStorage.setItem(STORE_KEY+'_ts',cloudTs.toString());
      rerender();
      setSyncStatus('synced','Actualizado '+new Date(data.updated_at).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}));
      toast('☁️ Datos descargados de la nube');
    }else{
      // Primera vez con este usuario — subimos lo local
      await pushToCloud();
    }
  }catch(err){
    console.error('Pull error:',err);
    setSyncStatus('error',err.message);
  }finally{isPulling=false}
}

async function pushToCloud(){
  if(!currentUser||!sb||isPulling)return;
  setSyncStatus('syncing');
  try{
    const {error}=await sb.from('finanzas_data').upsert({user_id:currentUser.id,data:S,modules:modulesCustom},{onConflict:'user_id'});
    if(error)throw error;
    const now=new Date();
    localStorage.setItem(STORE_KEY+'_ts',now.getTime().toString());
    setSyncStatus('synced','☁️ Subido '+now.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(err){
    console.error('Push error:',err);
    setSyncStatus(navigator.onLine?'error':'offline',err.message);
    toast('⚠️ No se subió a la nube: '+err.message,'error');
  }
}

function scheduleCloudSync(){
  if(!currentUser)return;
  if(syncTimer)clearTimeout(syncTimer);
  syncTimer=setTimeout(pushToCloud,200); // bajado de 800ms a 200ms
}

/* Último push antes de cerrar la pestaña o la app.
   Esto estuvo roto desde que se escribió: usaba `sb.auth.session()`, que es
   de supabase-js v1, y la app carga la v2 (allí solo existe getSession(), y
   es asíncrono). La cadena se resolvía a undefined, el header salía vacío,
   la petición llegaba anónima, RLS la rechazaba y el .catch() se tragaba el
   error. Ahora se usa el token que initSupabase mantiene al día, y si no hay
   token no se intenta: mejor no llamar que fingir que se guardó. */
window.addEventListener('beforeunload',()=>{
  if(!currentUser||!syncTimer||!accessToken)return;
  clearTimeout(syncTimer);syncTimer=null;
  try{
    // sendBeacon no permite headers propios, así que va fetch con keepalive:
    // el navegador la mantiene viva aunque la página ya se haya cerrado.
    fetch(`${SUPABASE_URL}/rest/v1/finanzas_data?on_conflict=user_id`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPABASE_ANON_KEY,
        'Authorization':'Bearer '+accessToken,
        'Prefer':'resolution=merge-duplicates,return=minimal'
      },
      body:JSON.stringify({user_id:currentUser.id,data:S,modules:modulesCustom}),
      keepalive:true
    }).catch(()=>{});
  }catch(e){}
});

// Sincronizar al volver al foreground (tab activo de nuevo)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&currentUser){
    pullFromCloud();
  }
});

async function sendMagicLink(){
  const email=document.getElementById('login-email').value.trim();
  if(!email||!email.includes('@'))return toast('Email inválido','error');
  setSyncStatus('syncing','Enviando link...');
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){toast('Error: '+error.message,'error');setSyncStatus('local');return}
  toast('✉️ Revisa tu email y haz click en el link');
  document.getElementById('login-status').innerHTML=`<div style="background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);border-radius:12px;padding:14px;margin-top:14px;font-size:.88rem">📧 Te envié un link de acceso a <b>${email}</b>. Ábrelo y volverás aquí ya logueado. <br><br><b>Tip:</b> abre el link en el mismo navegador donde estás ahora.</div>`;
}

async function loginWithPassword(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!email.includes('@'))return toast('Email inválido','error');
  if(!pass||pass.length<6)return toast('Contraseña debe tener al menos 6 caracteres','error');
  setSyncStatus('syncing','Iniciando sesión...');
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){
    // Si la cuenta no tiene contraseña aún (entró con magic link antes), tratar de crear
    if(error.message.includes('Invalid login')){
      toast('Si nunca creaste contraseña, usa el magic link primero y luego crea una desde Configuración','error');
    }else{
      toast('Error: '+error.message,'error');
    }
    setSyncStatus('local');return;
  }
  toast('✓ Bienvenido');
}

async function setPassword(){
  const newPass=prompt('Crea una contraseña (mínimo 6 caracteres) para poder entrar desde la app instalada sin magic link:');
  if(!newPass)return;
  if(newPass.length<6)return toast('Mínimo 6 caracteres','error');
  const {error}=await sb.auth.updateUser({password:newPass});
  if(error)return toast('Error: '+error.message,'error');
  toast('✓ Contraseña creada. Ahora puedes entrar con email + contraseña');
}

async function logoutSupabase(){
  if(!sb)return;
  await sb.auth.signOut();
  currentUser=null;accessToken=null;
  setSyncStatus('local');
  rerender();
  toast('Sesión cerrada (datos siguen locales)');
}

async function manualRefresh(){
  if(!currentUser){
    toast('Inicia sesión primero en Configuración','error');
    return;
  }
  const btn=document.getElementById('refresh-btn');
  if(btn){btn.style.pointerEvents='none';btn.innerHTML='⏳ Bajando...'}
  await pullFromCloud(true); // force overwrite con los datos de la nube
  if(btn){btn.style.pointerEvents='';btn.innerHTML='🔄 Refrescar'}
}

/* ---------- INDEXEDDB para recibos (fotos) ---------- */
let DB=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('iconeFinanzasDB',1);
    r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains('recibos'))db.createObjectStore('recibos',{keyPath:'id'})};
    r.onsuccess=e=>{DB=e.target.result;res(DB)};
    r.onerror=e=>rej(e);
  });
}
function dbPut(rec){return new Promise((res,rej)=>{const tx=DB.transaction('recibos','readwrite');tx.objectStore('recibos').put(rec);tx.oncomplete=()=>res();tx.onerror=rej})}
function dbGet(id){return new Promise((res,rej)=>{const tx=DB.transaction('recibos','readonly');const r=tx.objectStore('recibos').get(id);r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbAll(){return new Promise((res,rej)=>{const tx=DB.transaction('recibos','readonly');const r=tx.objectStore('recibos').getAll();r.onsuccess=()=>res(r.result);r.onerror=rej})}
function dbDel(id){return new Promise((res,rej)=>{const tx=DB.transaction('recibos','readwrite');tx.objectStore('recibos').delete(id);tx.oncomplete=()=>res();tx.onerror=rej})}

/* ---------- TOAST ---------- */
function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>t.classList.remove('show'),3800);
}

function pctDelta(now,prev,inverse=false){
  if(!prev)return prev===0&&now===0?'<span style="color:var(--muted)">Sin datos previos</span>':'<span class="up">Nuevo registro</span>';
  const d=((now-prev)/prev)*100;
  const positive=inverse?d<0:d>0;
  return `<span class="${positive?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}% vs mes anterior</span>`;
}
function getPrevMonth(ym){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-2,1);return mesLocal(d)}

/* Devuelve el saldo MÁS RECIENTE de una cuenta.
   Si hay varios con la misma fecha, gana el último insertado (índice mayor). */
function getUltimoSaldo(cuentaId,maxFecha){
  let best=null,bestIdx=-1;
  for(let i=0;i<S.saldos.length;i++){
    const s=S.saldos[i];
    if(s.cuentaId!==cuentaId)continue;
    if(maxFecha&&s.fecha>maxFecha)continue;
    if(!best||s.fecha>best.fecha||(s.fecha===best.fecha&&i>bestIdx)){
      best=s;bestIdx=i;
    }
  }
  return best;
}
function getSaldoConsolidado(){
  return S.cuentas.reduce((acc,c)=>{const u=getUltimoSaldo(c.id);return acc+(u?u.monto:0)},0);
}

/* ── Saldo proyectado ───────────────────────────────────────────────
   Hay dos cifras por cuenta y las dos importan:

   FOTO       S.saldos, lo que el banco decía el día del corte. Es el
              dato verificado y no se toca nunca.
   PROYECTADO foto + los movimientos que registraste después.

   No se pisa la foto con el cálculo a propósito. Si se pisara, un solo
   movimiento olvidado dejaría el saldo mal para siempre y sin avisar.
   Manteniendo las dos, la diferencia entre ellas ES la información:
   es exactamente lo que gastaste sin registrar.

   Los movimientos del MISMO día del corte no se suman: se asume que la
   foto ya los refleja. Si se sumaran, un corte tomado por la noche
   contaría dos veces lo que gastaste esa mañana. */
const nombreCuenta=id=>{const c=S.cuentas.find(x=>x.id===id);return c?(c.alias||c.banco):''};

/* Selector de cuenta para lotes (escaneo y dictado). Una factura se paga
   de una sola cuenta, asi que no tiene sentido preguntarlo linea por
   linea como si fuera el metodo de pago. */
function selectCuentaLote(id,label){
  if(!S.cuentas.length)return '';
  return `<div class="field" style="margin-top:14px"><label>${label}</label>
    <select class="icone-select" id="${id}">
      <option value="">— Sin especificar —</option>
      ${S.cuentas.map(c=>`<option value="${c.id}" ${S.config.ultimaCuentaEg===c.id?'selected':''}>${c.alias||c.banco}</option>`).join('')}
    </select></div>`;
}
function valorCuentaLote(id){
  const el=document.getElementById(id);
  const v=el?el.value:'';
  if(v)S.config.ultimaCuentaEg=v;
  return v||'';
}

function movsDeCuenta(cuentaId,desdeExclusive){
  const enRango=f=>!desdeExclusive||f>desdeExclusive;
  const filtro=m=>m.cuentaId===cuentaId&&enRango(m.fecha);
  const ing=S.ingresos.filter(filtro),eg=S.egresos.filter(filtro);
  /* El mismo traslado resta en una cuenta y suma en la otra. Por eso se
     miran los dos extremos por separado: para la cuenta origen es salida,
     para la destino es entrada. */
  const tOut=S.traslados.filter(t=>t.origenId ===cuentaId&&enRango(t.fecha));
  const tIn =S.traslados.filter(t=>t.destinoId===cuentaId&&enRango(t.fecha));
  const sum=a=>a.reduce((x,y)=>x+(+y.monto||0),0);
  const totalIng=sum(ing),totalEg=sum(eg),totalIn=sum(tIn),totalOut=sum(tOut);
  return {ing,eg,tIn,tOut,totalIng,totalEg,totalIn,totalOut,
    delta:(totalIng+totalIn)-(totalEg+totalOut),
    n:ing.length+eg.length+tIn.length+tOut.length};
}

function getSaldoProyectado(cuentaId){
  const ult=getUltimoSaldo(cuentaId);
  const mv=movsDeCuenta(cuentaId,ult?ult.fecha:null);
  const base=ult?ult.monto:0;
  return {...mv,base,fechaBase:ult?ult.fecha:null,tieneFoto:!!ult,proyectado:base+mv.delta};
}

function getSaldoProyectadoConsolidado(){
  return S.cuentas.reduce((a,c)=>a+getSaldoProyectado(c.id).proyectado,0);
}

/* Movimientos sin cuenta asignada: no entran en ninguna proyección.
   Los 218 del histórico viven aquí y es correcto que así sea. */
function movsSinCuenta(){
  const f=m=>!m.cuentaId;
  return S.ingresos.filter(f).length+S.egresos.filter(f).length;
}

let charts={};
function destroyChart(k){if(charts[k]){charts[k].destroy();delete charts[k]}}
/* 13 colores: uno por división COICOP, para que la misma categoría
   conserve su color en todas las gráficas. */
const chartColors=['#00d4ff','#7b2fff','#ff8c00','#00d48a','#ffd93d','#ff4757','#3498db','#e056fd','#ff7979','#2dd4bf','#a78bfa','#fbbf24','#f472b6'];
const colorDeCategoria=c=>{const i=COICOP.findIndex(x=>x.nombre===c);return chartColors[(i<0?0:i)%chartColors.length]};

/* Porcentaje de un punto respecto al total que le corresponde:
   en circulares, sobre el total del anillo; en barras, sobre el total
   de esa misma columna (así funciona igual con barras apiladas). */
function pctDeDato(chart,di,i){
  const ds=chart.data.datasets[di];
  const tipo=chart.getDatasetMeta(di).type||chart.config.type;
  const v=+ds.data[i]||0;
  let total;
  if(tipo==='doughnut'||tipo==='pie'){
    total=ds.data.reduce((a,b)=>a+(+b||0),0);
  }else{
    const visibles=chart.data.datasets.filter((_,dj)=>!chart.getDatasetMeta(dj).hidden).length;
    total=visibles<=1
      // Una sola serie: el porcentaje útil es cuánto pesa esa barra en el total.
      ? ds.data.reduce((a,b)=>a+(+b||0),0)
      // Varias series apiladas: cuánto pesa dentro de su propia columna.
      : chart.data.datasets.reduce((a,d,dj)=>chart.getDatasetMeta(dj).hidden?a:a+(+d.data[i]||0),0);
  }
  return total?v/total:0;
}

/* Plugin propio que dibuja el % dentro de la gráfica. Se hace a mano
   en vez de traer chartjs-plugin-datalabels por CDN: una dependencia
   menos que puede fallar, y este repo carga desde la red lo mínimo. */
const pluginPorcentaje={
  id:'porcentaje',
  afterDatasetsDraw(chart){
    if(chart.options.sinPorcentaje)return;
    const tipoBase=chart.config.type;
    if(tipoBase==='line')return;
    const ctx=chart.ctx;
    chart.data.datasets.forEach((ds,di)=>{
      const meta=chart.getDatasetMeta(di);
      if(meta.hidden)return;
      meta.data.forEach((el,i)=>{
        if(!(+ds.data[i]))return;
        const pct=pctDeDato(chart,di,i);
        if(pct<0.05)return;                    // etiqueta ilegible: mejor no pintarla
        const p=el.tooltipPosition();
        const txt=(pct*100).toFixed(pct<0.1?1:0)+'%';
        ctx.save();
        ctx.font='600 11px system-ui,-apple-system,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.lineWidth=3;ctx.strokeStyle='rgba(5,13,31,.8)';
        ctx.strokeText(txt,p.x,p.y);
        ctx.fillStyle='#fff';ctx.fillText(txt,p.x,p.y);
        ctx.restore();
      });
    });
  }
};
if(window.Chart)Chart.register(pluginPorcentaje);

/* Tooltip que siempre muestra monto y porcentaje. */
const tooltipPct={
  backgroundColor:'rgba(5,13,31,.95)',borderColor:'rgba(0,212,255,.3)',borderWidth:1,
  padding:10,titleFont:{size:12},bodyFont:{size:12},
  callbacks:{label(ctx){
    const p=ctx.parsed;
    const v=typeof p==='number'?p:(ctx.chart.options.indexAxis==='y'?p.x:p.y);
    const pct=pctDeDato(ctx.chart,ctx.datasetIndex,ctx.dataIndex);
    const nombre=ctx.dataset.label||ctx.label||'';
    return ` ${nombre}: ${fmtCOP(v)} · ${(pct*100).toFixed(1)}%`;
  }}
};

/* Etiquetas del eje de montos. Antes era `(v/1000).toFixed(0)+'k'`, que con
   una gráfica en ceros repetía «0k, 0k, -0k» en todos los renglones, y con
   tus cifras reales mostraba «4700k» donde se lee mejor «$4,7M». */
function ejeMonto(v){
  if(!v)return '0';
  const abs=Math.abs(v);
  if(abs>=1e6)return (v/1e6).toFixed(abs<1e7?1:0).replace('.',',')+'M';
  if(abs>=1000)return Math.round(v/1000)+'k';
  return v;
}
const chartBase={
  plugins:{legend:{labels:{color:'#fff',font:{size:11}}},tooltip:tooltipPct},
  scales:{x:{ticks:{color:'rgba(255,255,255,.7)'},grid:{color:'rgba(255,255,255,.06)'}},
          y:{ticks:{color:'rgba(255,255,255,.7)',callback:ejeMonto},grid:{color:'rgba(255,255,255,.06)'}}},
  maintainAspectRatio:false,responsive:true,
  interaction:{mode:'index',intersect:false}
};
const chartCircular={
  plugins:{legend:{position:'right',labels:{color:'#fff',font:{size:11},padding:8}},tooltip:tooltipPct},
  maintainAspectRatio:false,responsive:true,cutout:'58%'
};

function renderDashboardCharts(){
  // Evolución de saldos por cuenta
  destroyChart('saldos');
  const ctx1=document.getElementById('ch-saldos');
  if(ctx1){
    const allDates=[...new Set(S.saldos.map(s=>s.fecha))].sort();
    const datasets=S.cuentas.map((c,i)=>{
      const series=allDates.map(f=>{const reg=getUltimoSaldo(c.id,f);return reg?reg.monto:null});
      return {label:c.alias||c.banco,data:series,borderColor:c.color||chartColors[i%chartColors.length],backgroundColor:(c.color||chartColors[i%chartColors.length])+'33',tension:.3,fill:false,spanGaps:true};
    });
    charts.saldos=new Chart(ctx1,{type:'line',data:{labels:allDates.map(d=>fmtDate(d)),datasets},options:chartBase});
  }

  // Flujo ingresos vs egresos últimos 6 meses
  destroyChart('flujo');
  const ctx2=document.getElementById('ch-flujo');
  if(ctx2){
    const months=[];const d=new Date();d.setDate(1);
    for(let i=5;i>=0;i--){const x=new Date(d);x.setMonth(d.getMonth()-i);months.push(mesLocal(x))}
    const ing=months.map(m=>S.ingresos.filter(x=>monthKey(x.fecha)===m).reduce((a,b)=>a+b.monto,0));
    const eg=months.map(m=>S.egresos.filter(x=>monthKey(x.fecha)===m).reduce((a,b)=>a+b.monto,0));
    charts.flujo=new Chart(ctx2,{type:'bar',data:{labels:months.map(fmtMonth),datasets:[
      {label:'Ingresos',data:ing,backgroundColor:'rgba(0,212,138,.7)',borderColor:'#00d48a',borderWidth:1},
      {label:'Egresos',data:eg,backgroundColor:'rgba(255,71,87,.7)',borderColor:'#ff4757',borderWidth:1}
    ]},options:{...chartBase,
      // Aquí las barras se comparan entre sí, no componen un total: un
      // "40% de la columna" no querría decir nada. Se muestra la relación real.
      sinPorcentaje:true,
      plugins:{...chartBase.plugins,tooltip:{...tooltipPct,callbacks:{
        label:c=>` ${c.dataset.label}: ${fmtCOP(c.parsed.y)}`,
        afterBody(items){
          const i=items[0].dataIndex, entra=ing[i], sale=eg[i];
          if(!entra)return sale?'Sin ingresos registrados este mes':'';
          return `Gastas el ${Math.round(sale/entra*100)}% de lo que entra`;
        }}}}}});
  }

  // Anillo de categorías, con clic para bajar a las subcategorías
  pintarAnilloCategorias();

  // Composición del gasto por mes (barras apiladas por división)
  destroyChart('comp');
  const ctx4=document.getElementById('ch-comp');
  if(ctx4){
    const meses=ultimosMeses(6);
    const divs=[...new Set(S.egresos.map(e=>e.categoria))]
      .map(c=>({c,t:S.egresos.filter(e=>e.categoria===c).reduce((a,b)=>a+b.monto,0)}))
      .sort((a,b)=>b.t-a.t).slice(0,6).map(x=>x.c);   // las 6 que más pesan
    const datasets=divs.map(c=>({
      label:c,
      data:meses.map(m=>S.egresos.filter(e=>e.categoria===c&&monthKey(e.fecha)===m).reduce((a,b)=>a+b.monto,0)),
      backgroundColor:colorDeCategoria(c)+'cc',borderColor:colorDeCategoria(c),borderWidth:1
    }));
    charts.comp=new Chart(ctx4,{type:'bar',data:{labels:meses.map(fmtMonth),datasets},
      options:{...chartBase,scales:{x:{...chartBase.scales.x,stacked:true},y:{...chartBase.scales.y,stacked:true}},
        plugins:{...chartBase.plugins,legend:{labels:{color:'#fff',font:{size:10},boxWidth:12}}}}});
  }

  // Top subcategorías, barra horizontal
  destroyChart('sub');
  const ctx5=document.getElementById('ch-sub');
  if(ctx5){
    const porSub={};
    S.egresos.filter(e=>e.subcategoria).forEach(e=>{porSub[e.subcategoria]=(porSub[e.subcategoria]||0)+e.monto});
    const top=Object.entries(porSub).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(top.length){
      charts.sub=new Chart(ctx5,{type:'bar',
        data:{labels:top.map(x=>x[0]),datasets:[{label:'Gasto',data:top.map(x=>x[1]),
          backgroundColor:top.map((_,i)=>chartColors[i%chartColors.length]+'cc'),borderWidth:0}]},
        options:{...chartBase,indexAxis:'y',
          scales:{x:{...chartBase.scales.y},y:{...chartBase.scales.x}},
          plugins:{...chartBase.plugins,legend:{display:false}}}});
    }else{
      ctx5.parentElement.innerHTML='<div class="empty"><div class="empty-icon">🏆</div>Aún no hay subcategorías</div>';
    }
  }

  // Tasa de ahorro por mes — el indicador que pedía la auditoría
  destroyChart('ahorro');
  const ctx6=document.getElementById('ch-ahorro');
  if(ctx6){
    const meses=ultimosMeses(6);
    const tasas=meses.map(m=>{
      const i=S.ingresos.filter(x=>monthKey(x.fecha)===m).reduce((a,b)=>a+b.monto,0);
      const g=S.egresos.filter(x=>monthKey(x.fecha)===m).reduce((a,b)=>a+b.monto,0);
      return i>0?Math.round((1-g/i)*100):null;
    });
    charts.ahorro=new Chart(ctx6,{type:'line',
      data:{labels:meses.map(fmtMonth),datasets:[{label:'Tasa de ahorro',data:tasas,
        borderColor:'#00d48a',backgroundColor:'rgba(0,212,138,.18)',fill:true,tension:.3,spanGaps:true,
        pointRadius:5,pointBackgroundColor:'#00d48a'}]},
      options:{...chartBase,sinPorcentaje:true,
        scales:{x:chartBase.scales.x,y:{...chartBase.scales.y,ticks:{color:'rgba(255,255,255,.7)',callback:v=>v+'%'}}},
        plugins:{legend:{display:false},tooltip:{...tooltipPct,callbacks:{label:c=>
          c.parsed.y===null?' Sin ingresos registrados':` Ahorras el ${c.parsed.y}% de lo que entra`}}}}});
  }
}

/* Últimos N meses en formato YYYY-MM, terminando en el actual. */
function ultimosMeses(n){
  const out=[],d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d);x.setMonth(d.getMonth()-i);out.push(mesLocal(x))}
  return out;
}

/* El anillo tiene dos niveles: divisiones y, al tocar una, sus
   subcategorías. _anillo guarda en cuál estamos. */
let _anillo={categoria:null};
function pintarAnilloCategorias(){
  destroyChart('cat');
  const ctx=document.getElementById('ch-cat');
  if(!ctx)return;
  const mk=monthKey();
  const delMes=S.egresos.filter(x=>monthKey(x.fecha)===mk);
  const titulo=document.getElementById('ch-cat-titulo');

  let totales={},colores;
  if(_anillo.categoria){
    delMes.filter(e=>e.categoria===_anillo.categoria).forEach(e=>{
      const k=e.subcategoria||'(sin subcategoría)';
      totales[k]=(totales[k]||0)+e.monto;
    });
    colores=Object.keys(totales).map((_,i)=>chartColors[i%chartColors.length]);
    if(titulo)titulo.innerHTML=`🍩 ${_anillo.categoria} <button class="btn btn-ghost btn-sm" onclick="volverAnillo()" style="margin-left:8px">← todas</button>`;
  }else{
    delMes.forEach(e=>{totales[e.categoria]=(totales[e.categoria]||0)+e.monto});
    colores=Object.keys(totales).map(colorDeCategoria);
    if(titulo)titulo.innerHTML='🍩 Egresos por categoría (mes) <span style="color:var(--muted);font-size:.75rem;font-weight:400">· toca una porción para ver el detalle</span>';
  }

  const labels=Object.keys(totales),data=Object.values(totales);
  if(!labels.length){
    ctx.parentElement.innerHTML='<div class="empty"><div class="empty-icon">🍩</div>Sin egresos este mes</div>';
    return;
  }
  charts.cat=new Chart(ctx,{type:'doughnut',
    data:{labels,datasets:[{data,backgroundColor:colores,borderColor:'#0a1530',borderWidth:2}]},
    options:{...chartCircular,
      onClick(ev,els){
        if(!els.length||_anillo.categoria)return;      // ya estamos en el detalle
        _anillo.categoria=labels[els[0].index];
        pintarAnilloCategorias();
      },
      onHover(ev,els){ev.native.target.style.cursor=(els.length&&!_anillo.categoria)?'pointer':'default'}
    }});
}

function saveCuenta(id){
  const banco=document.getElementById('f-banco').value.trim();
  if(!banco)return toast('Ingresa el banco','error');
  const data={banco,alias:document.getElementById('f-alias').value.trim(),tipo:document.getElementById('f-tipo').value,color:document.getElementById('f-color').value};
  if(id){Object.assign(S.cuentas.find(x=>x.id===id),data)}else{S.cuentas.push({id:uid(),...data})}
  saveState();closeModal();rerender();toast('Cuenta guardada');
}
function delCuenta(id){
  /* Los movimientos NO se borran: el gasto ocurrió aunque la cuenta ya no
     exista. Pero hay que soltarles la cuenta, porque si quedan apuntando
     a un id muerto pasa lo peor de los dos mundos: dejan de sumar en
     cualquier proyección y aun así se ven como "ya asignados". */
  const huerfanos=[...S.ingresos,...S.egresos].filter(m=>m.cuentaId===id).length;
  const cortes=S.saldos.filter(x=>x.cuentaId===id).length;
  const tocados=S.traslados.filter(t=>t.origenId===id||t.destinoId===id).length;
  if(!confirm(`¿Eliminar la cuenta y sus ${cortes} corte(s)?`
    +(huerfanos?`\n\n${huerfanos} movimiento(s) quedarán sin cuenta asignada. No se borran.`:'')
    +(tocados?`\n\n${tocados} traslado(s) se conservan con este extremo vacío, para no alterar el saldo de la otra cuenta.`:'')))return;
  S.cuentas=S.cuentas.filter(x=>x.id!==id);
  S.saldos=S.saldos.filter(x=>x.cuentaId!==id);
  S.ingresos.forEach(m=>{if(m.cuentaId===id)m.cuentaId=''});
  S.egresos .forEach(m=>{if(m.cuentaId===id)m.cuentaId=''});
  /* El traslado se conserva con un extremo vacío en vez de borrarse: la otra
     cuenta sí recibió (o entregó) esa plata, y eliminarlo le correría el
     saldo proyectado por un movimiento que de verdad ocurrió. Solo se
     descarta cuando ya no queda ninguna cuenta viva en los dos extremos. */
  S.traslados.forEach(t=>{if(t.origenId===id)t.origenId='';if(t.destinoId===id)t.destinoId=''});
  S.traslados=S.traslados.filter(t=>t.origenId||t.destinoId);
  if(S.config.ultimaCuentaIng===id)S.config.ultimaCuentaIng='';
  if(S.config.ultimaCuentaEg ===id)S.config.ultimaCuentaEg ='';
  saveState();rerender();toast('Cuenta eliminada');
}

function addBolsilloRow(nombre='',monto=''){
  const wrap=document.getElementById('f-bolsillos');if(!wrap)return;

  row.className='bolsillo-row';

    <input type="number" step="any" class="icone-input bolsillo-monto" placeholder="0" value="${monto||''}" oninput="updateBolsilloTotal()" style="padding:11px 14px;text-align:right;font-variant-numeric:tabular-nums">
    <button class="btn btn-icon btn-sm btn-ghost" onclick="this.parentElement.remove();updateBolsilloTotal()" title="Eliminar">✕</button>`;
  wrap.appendChild(row);
  // focus al nuevo si está vacío
  if(!nombre)row.querySelector('input').focus();
}

function updateBolsilloTotal(){
  const inputs=document.querySelectorAll('#f-bolsillos .bolsillo-monto');
  let t=0;inputs.forEach(i=>{t+=parseFloat(i.value)||0});
  const out=document.getElementById('f-total');if(out)out.textContent=fmtCOP(t);
}
function saveSaldo(){
  try{
    const rows=document.querySelectorAll('#f-bolsillos .bolsillo-row');
    const bolsillos=[];let total=0;
    rows.forEach(r=>{
      const n=r.querySelector('input').value.trim();
      const m=parseFloat(r.querySelector('.bolsillo-monto').value)||0;
      if(n){bolsillos.push({n,m});total+=m}
    });
    if(!bolsillos.length)return toast('Agrega al menos un bolsillo','error');
    const cuentaId=document.getElementById('f-cuenta').value;
    const fecha=document.getElementById('f-fecha').value;
    /* Un corte sin fecha rompe getUltimoSaldo: las comparaciones son de
       texto, y '' pierde contra cualquier fecha real, así que el corte
       quedaría guardado pero nunca sería el más reciente de su cuenta. */
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha))return toast('Falta la fecha del corte','error');
    const nuevo={id:uid(),cuentaId,fecha,monto:total,bolsillos,nota:document.getElementById('f-nota').value.trim(),createdAt:new Date().toISOString()};
    /* Hay que capturar la proyección ANTES de guardar el corte nuevo:
       después ya no existe, porque el corte nuevo pasa a ser la base. */
    const prev=getSaldoProyectado(cuentaId);
    S.saldos.push(nuevo);
    saveState();
    // Verificar que realmente se guardó en localStorage
    const verif=JSON.parse(localStorage.getItem(STORE_KEY));
    const saved=verif.saldos.find(s=>s.id===nuevo.id);
    if(!saved){toast('⚠️ Error: no se pudo guardar en este dispositivo','error');return}
    closeModal();rerender();
    const cuenta=S.cuentas.find(c=>c.id===cuentaId);
    toast('✓ '+(cuenta.alias||cuenta.banco)+': '+fmtCOP(total));
    conciliar(prev,nuevo,cuenta);
  }catch(err){
    console.error('Error guardando saldo:',err);
    toast('❌ Error: '+err.message,'error');
  }
}
/* Cuadre: compara lo que registraste desde el corte anterior contra lo
   que el banco dice hoy. La diferencia no es un error del cálculo, es
   plata que se movió sin que la anotaras — y verla es todo el punto de
   guardar la foto y la proyección por separado.

   Solo interrumpe si de verdad hay algo que decir: tiene que haber un
   corte anterior, movimientos en medio, el corte nuevo debe ser
   posterior (si estás corrigiendo una fecha vieja no aplica) y la
   diferencia debe superar el ruido de redondeo. */
function conciliar(prev,nuevo,cuenta){
  if(!prev.tieneFoto||!prev.n||nuevo.fecha<=prev.fechaBase)return false;
  const gap=nuevo.monto-prev.proyectado;
  if(Math.abs(gap)<1000)return false;
  const falta=gap<0;
  openModal(`<h2>${falta?'⚠️':'ℹ️'} Cuadre de ${cuenta.alias||cuenta.banco}</h2>
    <p style="color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:14px">
      Comparé lo que registraste desde el corte del ${fmtDate(prev.fechaBase)} contra lo que acabas de leer en el banco.
    </p>
    <div class="proy-box" style="margin-bottom:14px">
      <div><span class="k">Corte anterior</span><span class="amount">${fmtCOP(prev.base)}</span></div>
      ${prev.totalIng?`<div><span class="k">Ingresos que registraste</span><span class="amount pos">+${fmtCOP(prev.totalIng)}</span></div>`:''}
      ${prev.totalEg?`<div><span class="k">Egresos que registraste</span><span class="amount neg">−${fmtCOP(prev.totalEg)}</span></div>`:''}
      ${prev.totalIn?`<div><span class="k">Traslados recibidos</span><span class="amount pos">+${fmtCOP(prev.totalIn)}</span></div>`:''}
      ${prev.totalOut?`<div><span class="k">Traslados enviados</span><span class="amount neg">−${fmtCOP(prev.totalOut)}</span></div>`:''}
      <div style="border-top:1px solid rgba(255,255,255,.14);padding-top:7px;margin-top:2px"><span class="k">Deberías tener</span><span class="amount">${fmtCOP(prev.proyectado)}</span></div>
      <div><span class="k">El banco dice</span><span class="amount">${fmtCOP(nuevo.monto)}</span></div>
    </div>
    <div style="background:${falta?'rgba(255,71,87,.10)':'rgba(0,212,138,.10)'};border:1px solid ${falta?'rgba(255,71,87,.30)':'rgba(0,212,138,.30)'};border-radius:12px;padding:14px 16px">
      <div style="font-size:1.4rem;font-weight:700;color:${falta?'var(--red)':'var(--green)'};font-variant-numeric:tabular-nums">${falta?'−':'+'}${fmtCOP(Math.abs(gap))}</div>
      <div style="font-size:.85rem;color:rgba(255,255,255,.75);margin-top:5px;line-height:1.5">
        ${falta
          ?'Salió más plata de la que registraste. Suele ser compras pequeñas sin anotar, cuotas de manejo, o un traslado a otra cuenta tuya que no quedó registrado.'
          :'Entró más plata de la que registraste, o algún egreso quedó anotado de más.'}
      </div>
    </div>
    <p style="color:var(--muted);font-size:.78rem;margin-top:12px;line-height:1.5">El corte que acabas de guardar queda como dato verificado. La proyección arranca de nuevo desde él, así que esta diferencia no se arrastra.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn btn-primary" onclick="closeModal()">Entendido</button></div>`);
  return true;
}

function delSaldo(id){if(!confirm('¿Eliminar este registro?'))return;S.saldos=S.saldos.filter(x=>x.id!==id);saveState();rerender();toast('Eliminado')}

/* ═══════════════════════════════════════════════════════════
   TRASLADOS ENTRE CUENTAS PROPIAS
   Sin esto, pasar plata de Bancolombia a Nequi aparecía como un
   faltante en una cuenta y un sobrante en la otra, y el cuadre
   acusaba un descuadre que en realidad nunca existió.
   ═══════════════════════════════════════════════════════════ */
function formTraslado(id){
  if(S.cuentas.length<2)return toast('Necesitas al menos dos cuentas para hacer un traslado','error');
  const t=id?S.traslados.find(x=>x.id===id):{fecha:today(),monto:'',origenId:S.cuentas[0].id,destinoId:S.cuentas[1].id,nota:''};
  const opts=sel=>S.cuentas.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${c.alias||c.banco}</option>`).join('');
  openModal(`<h2>${id?'Editar':'Nuevo'} traslado</h2>
    <p style="color:var(--muted);font-size:.86rem;line-height:1.6;margin-bottom:14px">Plata que mueves entre tus propias cuentas. No cuenta como ingreso ni como egreso: no cambia cuánto tienes, solo dónde lo tienes.</p>
    <div class="form-grid" style="grid-template-columns:1fr 1fr;gap:12px">
      <div class="field"><label>Sale de</label><select class="icone-select" id="t-origen" onchange="hintTraslado('${id||''}')">${opts(t.origenId)}</select></div>
      <div class="field"><label>Entra a</label><select class="icone-select" id="t-destino" onchange="hintTraslado('${id||''}')">${opts(t.destinoId)}</select></div>
      <div class="field"><label>Fecha</label><input type="date" class="icone-input" id="t-fecha" value="${t.fecha}"></div>
      <div class="field"><label>Monto (COP)</label><input type="number" step="any" class="icone-input" id="t-monto" value="${t.monto}" placeholder="0" oninput="hintTraslado('${id||''}')"></div>
    </div>
    <div class="field" style="margin-top:12px"><label>Nota</label><input class="icone-input" id="t-nota" value="${t.nota||''}" placeholder="Opcional"></div>
    <div id="t-hint" class="cuenta-hint"></div>
    <div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveTraslado('${id||''}')">Guardar</button></div>`);
  hintTraslado(id||'');
}

function hintTraslado(id){
  const el=document.getElementById('t-hint');if(!el)return;
  const o=document.getElementById('t-origen').value,d=document.getElementById('t-destino').value;
  const m=parseFloat(document.getElementById('t-monto').value)||0;
  if(o===d){el.innerHTML='<b style="color:var(--red)">El origen y el destino son la misma cuenta.</b>';return}
  /* Al editar hay que sacar el traslado viejo antes de simular: si no, se
     contaría el de antes y el nuevo a la vez. */
  const idx=id?S.traslados.findIndex(x=>x.id===id):-1;
  const guardado=idx>=0?S.traslados.splice(idx,1)[0]:null;
  const po=getSaldoProyectado(o).proyectado,pd=getSaldoProyectado(d).proyectado;
  if(guardado)S.traslados.splice(idx,0,guardado);
  el.innerHTML=m?`Quedaría · ${nombreCuenta(o)} <b style="color:#fff">${fmtCOP(po-m)}</b> · ${nombreCuenta(d)} <b style="color:#fff">${fmtCOP(pd+m)}</b>`:'';
}

function saveTraslado(id){
  const origenId=document.getElementById('t-origen').value;
  const destinoId=document.getElementById('t-destino').value;
  const monto=parseFloat(document.getElementById('t-monto').value)||0;
  const fecha=document.getElementById('t-fecha').value||today();
  if(origenId===destinoId)return toast('El origen y el destino no pueden ser la misma cuenta','error');
  if(monto<=0)return toast('El monto debe ser mayor que cero','error');
  const nota=document.getElementById('t-nota').value.trim();
  if(id){const t=S.traslados.find(x=>x.id===id);if(t)Object.assign(t,{origenId,destinoId,monto,fecha,nota});}
  else S.traslados.push({id:uid(),origenId,destinoId,monto,fecha,nota,createdAt:new Date().toISOString()});
  saveState();closeModal();rerender();
  toast('✓ '+fmtCOP(monto)+': '+nombreCuenta(origenId)+' → '+nombreCuenta(destinoId));
}

function delTraslado(id){if(!confirm('¿Eliminar este traslado? Los saldos proyectados de las dos cuentas se recalculan.'))return;S.traslados=S.traslados.filter(x=>x.id!==id);saveState();rerender();toast('Traslado eliminado')}

async function renderExistingRecibosInForm(ids){
  const wrap=document.getElementById('f-preview');

    div.dataset.existing=rid;
    wrap.appendChild(div);
  }
}
let _removedExisting=[];

function onFilesPick(e){
  const files=Array.from(e.target.files);
  const wrap=document.getElementById('f-preview');
  files.forEach(f=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      const data=ev.target.result;
      _pendingRecibos.push({id:uid(),data,name:f.name,size:f.size,createdAt:new Date().toISOString()});
      const div=document.createElement('div');div.className='p';
      div.innerHTML=`<img src="${data}"><button class="x" onclick="removeNewPreview(this,'${_pendingRecibos[_pendingRecibos.length-1].id}')">✕</button>`;

}

async function saveMov(tipo,id){
  const monto=parseFloat(document.getElementById('f-monto').value);
  if(isNaN(monto)||monto<=0)return toast('Monto inválido','error');
  /* La fecha se valida igual que el monto. Sin esto, un campo vacío se
     guardaba como fecha:'' y el movimiento desaparecía de todas las
     gráficas y de la proyección de saldos sin decir una palabra. */
  const fecha=document.getElementById('f-fecha').value;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(fecha))return toast('Falta la fecha del movimiento','error');
  const data={
    fecha,
    monto,categoria:document.getElementById('f-cat').value,
    nota:document.getElementById('f-nota').value.trim()
  };
  if(tipo==='ing')data.fuente=document.getElementById('f-fuente').value.trim();
  else{
    data.metodo=document.getElementById('f-metodo').value;
    data.subcategoria=valorSubcat(document.querySelector('#modal-content .sub-wrap'));
    aprenderSubcategoria(data.categoria,data.subcategoria);
  }

  /* La cuenta se recuerda para el siguiente movimiento del mismo tipo:
     casi siempre se repite, y obligar a elegirla cada vez hace que uno
     deje de elegirla. Si la cuenta recordada se borró, el select cae
     solo en "Sin especificar". */
  const selCuenta=document.getElementById('f-cuenta-mov');
  if(selCuenta){
    data.cuentaId=selCuenta.value||'';
    if(tipo==='ing')S.config.ultimaCuentaIng=data.cuentaId;
    else S.config.ultimaCuentaEg=data.cuentaId;
  }

  // recibos: guardar nuevos en DB
  for(const r of _pendingRecibos){await dbPut(r)}
  // recibos eliminados al editar
  for(const rid of (_removedExisting||[])){await dbDel(rid)}

  const arr=tipo==='ing'?S.ingresos:S.egresos;
  if(id){
    const m=arr.find(x=>x.id===id);
    const keepIds=Array.from(document.querySelectorAll('#f-preview .p[data-existing]')).map(d=>d.dataset.existing);
    Object.assign(m,data);
    m.recibos=[...keepIds,..._pendingRecibos.map(r=>r.id)];
  }else{
    arr.push({id:uid(),...data,recibos:_pendingRecibos.map(r=>r.id)});
  }
  _pendingRecibos=[];_removedExisting=[];
  saveState();closeModal();rerender();toast('Movimiento guardado');
}

function delMov(tipo,id){
  if(!confirm('¿Eliminar este movimiento? Los recibos asociados también se eliminarán.'))return;
  const arr=tipo==='ing'?S.ingresos:S.egresos;
  const m=arr.find(x=>x.id===id);
  if(m&&m.recibos)m.recibos.forEach(r=>dbDel(r));
  if(tipo==='ing')S.ingresos=S.ingresos.filter(x=>x.id!==id);
  else S.egresos=S.egresos.filter(x=>x.id!==id);
  saveState();rerender();toast('Eliminado');
}

/* ═══════════════════════════════════════════════════════════
   ESCÁNER DE FACTURAS CON IA (visión de Claude)
   La imagen va del navegador al Edge Function `claude-proxy`,
   que guarda la ANTHROPIC_API_KEY como secreto del servidor.
   Aquí NUNCA hay una API key: este repo es público.
   ═══════════════════════════════════════════════════════════ */
const PROXY_URL=SUPABASE_URL+'/functions/v1/claude-proxy';
/* Sonnet 5 y no Opus 5: el Edge Function de Supabase corta la petición a los
   ~150 s y devuelve 503. Con Opus una factura densa se pasaba de ese techo y
   la lectura moría sin resultado. Sonnet responde en una fracción del tiempo
   y para leer cifras y clasificar con un esquema fijo alcanza de sobra. */
const MODELO_VISION='claude-sonnet-5';
const TOPE_ESPERA_MS=110000;      // por debajo del corte del servidor
let _escaneo=null;

async function llamarClaude(payload,{tope=TOPE_ESPERA_MS}={}){
  if(!sb)throw new Error('Supabase no inicializó');
  const {data:{session}}=await sb.auth.getSession();
  if(!session)throw new Error('Inicia sesión en Configuración para usar la IA');
  const ctrl=new AbortController();
  const reloj=setTimeout(()=>ctrl.abort(),tope);
  let r;
  try{
    r=await fetch(PROXY_URL,{
      method:'POST',
      headers:{'content-type':'application/json','authorization':'Bearer '+session.access_token,'apikey':SUPABASE_ANON_KEY},
      body:JSON.stringify(payload),signal:ctrl.signal
    });
  }catch(e){
    if(e.name==='AbortError')throw new Error('La lectura tardó demasiado y se canceló. Prueba con una foto más recortada, o registra el gasto a mano.');
    throw new Error('No hubo conexión con el servidor. Revisa tu internet.');
  }finally{clearTimeout(reloj)}
  if(r.status===503)throw new Error('El servidor cortó la lectura por tiempo. Suele pasar con facturas muy largas: recorta la foto a la parte de los productos y vuelve a intentar.');
  const j=await r.json().catch(()=>({error:'Respuesta ilegible del servidor'}));
  if(!r.ok)throw new Error(j.error||('Error '+r.status));
  return j;
}

/* Reduce la foto antes de subirla: menos datos, menos costo, menos espera.
   1400 px deja intactos los pantallazos del celular (que vienen a ~1100-1300)
   y solo baja las fotos de cámara, donde ese detalle extra no aporta nada. */
function comprimirImagen(file,maxLado=1400,calidad=0.85){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('El archivo no es una imagen válida'));
      img.onload=()=>{
        let w=img.naturalWidth,h=img.naturalHeight;
        const esc=Math.min(1,maxLado/Math.max(w,h));
        w=Math.round(w*esc);h=Math.round(h*esc);
        const c=document.createElement('canvas');c.width=w;c.height=h;
        const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
        const dataUrl=c.toDataURL('image/jpeg',calidad);
        res({dataUrl,mediaType:'image/jpeg',base64:dataUrl.split(',')[1],w,h});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function esquemaFactura(){
  const cats=COICOP.map(c=>c.nombre);
  return {type:'object',additionalProperties:false,
    // El orden importa: al exigir `establecimiento` primero, el modelo tiene
    // que razonar el giro del negocio ANTES de mirar los ítems. Ese análisis
    // se convierte en el prior con el que luego revisa línea por línea.
    required:['establecimiento','tipo_documento','fecha','total_documento','confianza','nota','items'],
    properties:{
      establecimiento:{type:'object',additionalProperties:false,
        required:['nombre','giro','categoria_probable','razon'],
        properties:{
          nombre:{type:'string',description:'Nombre comercial tal como aparece. "" si no se distingue.'},
          giro:{type:'string',description:'Qué clase de negocio es: hotel, restaurante, café, supermercado, gran superficie mixta, droguería, estación de servicio, tienda de ropa, etc.'},
          categoria_probable:{type:'string',enum:cats,description:'La división a la que apunta ese giro, antes de mirar los ítems.'},
          razon:{type:'string',description:'Una frase corta explicando por qué ese giro implica esa división.'}
        }},
      tipo_documento:{type:'string',enum:['factura','recibo','pantallazo_movimientos','extracto','otro']},
      fecha:{type:'string',description:'Fecha del documento en formato YYYY-MM-DD. "" si no aparece.'},
